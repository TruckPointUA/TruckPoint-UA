<body>


<!-- =========================
     ВЕРХНІЙ ПРАВИЙ КУТ
========================= -->

<!-- =========================
     ВЕРХНІ ЕЛЕМЕНТИ КАРТИ
========================= -->

<!-- БЛИМАЮЧІ ІКОНКИ ЗЛІВА -->
<div id="activeCategoryIcons"></div>

<button id="myLocationButton" class="myLocationButton" title="Моє місце">
    <span class="googleLocationIcon">
        <span class="locationCenter"></span>
    </span>
</button>
<!-- КНОПКА ШАРІВ СПРАВА -->
<div id="mapControls">

    <div class="layerControl">

        <button id="layerButton" class="layerButton">
            <span class="layersIcon">▱</span>
        </button>

        <div id="layerMenu" class="layerMenu">

            <button
                id="roadLayerBtn"
                class="layerOption active"
            >
                <span class="layerPreview roadPreview"></span>
                <span>Карта</span>
            </button>

            <button
                id="satelliteLayerBtn"
                class="layerOption"
            >
                <span class="layerPreview satellitePreview"></span>
                <span>Супутник</span>
            </button>

        </div>

    </div>

</div>

<div id="map"></div>
<!-- =====================================================
     ВІКНО ІНФОРМАЦІЇ ПРО ТОЧКУ
===================================================== -->

<div id="pointInfoOverlay" class="pointInfoOverlay">

    <div class="pointInfoWindow">

        <!-- ШАПКА -->

        <div class="pointInfoHeader">

            <button
                class="pointInfoClose"
                onclick="closePointInfo()"
            >
                ×
            </button>

            <div
                id="pointInfoTitle"
                class="pointInfoTitle"
            >
                Точка
            </div>

           <div class="pointInfoCoordinatesRow">

    <div
        id="pointInfoCoordinates"
        class="pointInfoCoordinates"
    >
        Координати
    </div>

<button
    id="sharePointButton"
    class="sharePointButton"
    onclick="shareCurrentPoint()"
>
    Поділитися
</button>

</div>

        </div>


        <!-- ВМІСТ -->

        <div class="pointInfoContent">

            <!-- АВТОР -->

            <div class="pointInfoBlock">

                <div class="pointInfoLabel">
                    Автор
                </div>

                <div
                    id="pointInfoAuthor"
                    class="pointInfoValue"
                >
                    —
                </div>

            </div>


            <!-- ОПИС -->

            <div class="pointInfoBlock">

                <div class="pointInfoLabel">
                    Опис
                </div>

                <div
                    id="pointInfoDescription"
                    class="pointDescription"
                >
                    Опис відсутній
                </div>

            </div>


            <!-- ВІДГУКИ -->

            <div class="pointInfoBlock">

                <div class="reviewsTitle">
                    Відгуки
                </div>

                <div id="pointReviews">

                    <div class="noReviews">
                        Завантаження відгуків...
                    </div>

                </div>


                <!-- НОВИЙ ВІДГУК -->

                <div class="reviewForm">

                    <textarea
                        id="reviewText"
                        class="reviewTextarea"
                        placeholder="Напишіть свій відгук..."
                        maxlength="1000"
                    ></textarea>

                    <button
                        class="addReviewButton"
                        onclick="addPointReview()"
                    >
                        Додати відгук
                    </button>

                </div>

            </div>

        </div>

    </div>

</div>

<div id="bottomSheet" class="bottomSheet">

    <div id="sheetHandle" class="sheetHandle"></div>

    <div class="categoryScroll" id="categoryScroll">

<button class="categoryBtn" onclick="toggleShopping()">Закупи </button>

        <button class="categoryBtn" onclick="toggleParking()">
    Паркування
</button>

        <button class="categoryBtn">Сервіси</button>

    </div>

  <div class="sheetContent">

    <div id="shoppingCategories" class="subCategories">

<button 
    class="subCategoryBtn" 
    onclick="toggleGroceryStores(this)" 
>
    <img src="maarket_map.svg" class="categoryIcon">
    Продуктові магазини
</button>

<button class="subCategoryBtn" onclick="selectCategory(this)">
    Магазини ТІР
</button>

<button class="subCategoryBtn" onclick="selectCategory(this)">
     Блошиний ринок
</button>

    </div>
    <div id="parkingCategories" class="subCategories">

<button 
    class="subCategoryBtn" 
    onclick="selectParking(this)" 
>
    <img src="promzona_map.svg" class="categoryIcon">
    Промислова зона
</button>

<button 
    class="subCategoryBtn" 
    onclick="toggleRoadParking(this)" 
>
    <img src="pocket_map.svg" class="categoryIcon">
     Паркування при дорозі
</button>
 

    <button
        class="subCategoryBtn"
        onclick="selectParking(this)"
    >
         Паркування безкоштовне
    </button>

    <button
        class="subCategoryBtn"
        onclick="selectParking(this)"
    >
         Паркування платне
    </button>

    <button
        class="subCategoryBtn"
        onclick="selectParking(this)"
    >
          Паркування біля фірми
    </button>

</div>

</div>

</div>
