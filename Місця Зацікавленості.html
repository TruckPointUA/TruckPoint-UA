<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

body{
    background:#edf3ff;
    min-height:100vh;
    padding-top:0;
}

body{
    background:#edf3ff;
    transition:background .4s ease;
}


/* =========================
   ДЕННИЙ РЕЖИМ
========================= */

body.day-mode .header{
    background:#ffffff;
    color:#111;

    border-bottom:1px solid rgba(0,123,255,.20);

    box-shadow:
        0 6px 18px rgba(0,0,0,.15),
        0 3px 12px rgba(0,123,255,.18);
}

body.day-mode .header::before{
    background:
        linear-gradient(
            90deg,
            rgba(0,153,255,.08),
            rgba(0,191,255,.03),
            rgba(0,153,255,.08)
        );
}

body.day-mode .logo{
    color:#111;
}

body.day-mode #userInfo > div > div:first-child{
    color:#087eff !important;
}

body.day-mode #headerUserName{
    color:#111 !important;
}

body.day-mode #headerStats{
    color:#111 !important;
    background:rgba(0,123,255,.10) !important;
    border:1px solid rgba(0,123,255,.15);
}

body.day-mode .bottomSheet{
    background:#ffffff;
    color:#111;

    box-shadow:
        0 -5px 18px rgba(0,0,0,.18);
}

body.day-mode .sheetHandle{
    background:#888;
}


/* =========================
   НІЧНИЙ РЕЖИМ
========================= */

body.night-mode{
    background:#080d14;
}

body.night-mode .header{
    background:#10151d;
    color:#fff;

    border-bottom:1px solid rgba(0,191,255,.25);

    box-shadow:
        0 8px 18px rgba(0,0,0,.55),
        0 3px 12px rgba(0,191,255,.20);
}

body.night-mode .header::before{
    background:
        linear-gradient(
            90deg,
            rgba(0,153,255,.12),
            rgba(0,191,255,.04),
            rgba(0,153,255,.12)
        );
}

body.night-mode .logo{
    color:#fff;
}

body.night-mode #userInfo > div > div:first-child{
    color:#00bfff !important;
}

body.night-mode #headerUserName{
    color:#fff !important;
}

body.night-mode #headerStats{
    color:#fff !important;
    background:rgba(0,191,255,.12) !important;
    border:1px solid rgba(0,191,255,.18);
}

body.night-mode .bottomSheet{
    background:#10151d;
    color:#fff;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.55);
}

body.night-mode .sheetHandle{
    background:#777;
}

/* світловий фон */

.header::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,153,255,.10),
            rgba(0,191,255,.04),
            rgba(0,153,255,.10)
        );

    pointer-events:none;
}


/* фоновий логотип */

.header::after{
    content:"";

    position:absolute;

    right:18px;
    top:50%;

    transform:translateY(-50%);

    width:58px;
    height:58px;

    background:url("logo.png") center/contain no-repeat;

    opacity:.10;

    pointer-events:none;
}

/* Truck Point UA */

#userInfo > div > div:first-child{
    color:#00bfff !important;

    letter-spacing:1.5px !important;

    font-size:11px !important;

    font-weight:600;
}


/* =========================
   ТЕЛЕФОН
========================= */

@media(max-width:480px){

    }

        height:46px;
    }

}


/* =========================
   ОСНОВНА СТОРІНКА
========================= */

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

#map{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    z-index:1;
}

.bottomSheet{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:24px;

    background:#161b22;
    color:white;

    border-radius:16px 16px 0 0;

    z-index:20000;

    box-shadow:
        0 -4px 15px rgba(0,0,0,.35);

    overflow:hidden;

    transition:height .3s ease;

    touch-action:none;
}



.sheetHandle{
    width:100px;
    height:10px;

    background:#777;

    border-radius:10px;

    margin:8px auto;

    cursor:grab;

    touch-action:none;

    position:relative;
}

.sheetHandle::after{
    content:"";

    position:absolute;

    left:-30px;
    right:-30px;

    top:-18px;
    bottom:-18px;
}

.sheetContent{
    height:calc(100% - 30px);
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;

    -webkit-overflow-scrolling:touch;
}

.bottomSheet.open{
    height:100dvh;
    border-radius:0;

    z-index:99999;

    transition:height .3s ease;
}

.categoryScroll{
    display:flex;
    gap:10px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:4px 12px 10px;

    white-space:nowrap;

    scrollbar-width:none;

    touch-action:pan-x;

    -webkit-overflow-scrolling:touch;
}

.categoryScroll::-webkit-scrollbar{
    display:none;
}

.categoryBtn{
    flex:0 0 auto;

    border:none;

    padding:13px 20px;

    border-radius:22px;

    background:#252d38;

    color:#fff;

    font-family:'Montserrat',sans-serif;

    font-size:16px;

    font-weight:700;

    box-shadow:0 4px 10px rgba(0,0,0,.25);

    cursor:pointer;

    white-space:nowrap;

    user-select:none;

    -webkit-user-select:none;
}

.categoryBtn:active{
    transform:scale(.95);
}

.subCategories{
    display:none;
    flex-direction:column;
    gap:14px;
    padding:8px 5px 25px;

.subCategories.show{

}

    color:#fff;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.subCategoryBtn:active{
    transform:scale(.98);

/* =========================
   ІКОНКИ ВИБРАНИХ КАТЕГОРІЙ
========================= */

#activeCategoriesBar{
    position:fixed;

    top:90px;
    left:10px;

    gap:8px;

    align-items:center;

}

/* одна іконка */

.activeCategoryIcon{
    width:42px;
    height:42px;

    flex:0 0 42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(16,21,29,.88);

    border:2px solid #00bfff;

    box-shadow:
        0 0 8px rgba(0,191,255,.65),
        0 0 18px rgba(0,191,255,.35);

    font-size:22px;

    animation:
        categoryBlink 1.2s infinite ease-in-out;
}

/* плавне блимання */

@keyframes categoryBlink{

    0%{
        opacity:.45;

        transform:scale(.92);

        box-shadow:
            0 0 5px rgba(0,191,255,.35);
    }

    50%{
        opacity:1;

        transform:scale(1.08);

        box-shadow:
            0 0 12px rgba(0,191,255,.9),
            0 0 25px rgba(0,191,255,.55);
    }

    100%{
        opacity:.45;

        transform:scale(.92);

        box-shadow:
            0 0 5px rgba(0,191,255,.35);
    }

}



/* телефон */

function getCategoryFromIcon(icon){

    const name = String(icon || "").toLowerCase();

    /* Продуктові магазини */
    if(
        name.includes("maarket") ||
        name.includes("market")
    ){
        return "market";
    }

    /* Паркування при дорозі */
    if(
        name.includes("pocket")
    ){
        return "road_parking";
    }

    /* Промислова зона */
    if(
        name.includes("promzona") ||
        name.includes("industrial")
    ){
        return "industrial";
    }

    /* Мийки */
    if(
        name.includes("wash") ||
        name.includes("miyka")
    ){
        return "wash";
    }

    /* АЗС */
    if(
        name.includes("gas") ||
        name.includes("azs") ||
        name.includes("fuel")
    ){
        return "gas_station";
    }

    /* Звичайне паркування */
    if(
        name.includes("parking")
    ){
        return "parking";
    }

    /* Магазини ТІР */
    if(
        name.includes("truck_shop") ||
        name.includes("tir_shop")
    ){
        return "truck_shop";
    }

    /* Блошиний ринок */
    if(
        name.includes("flea") ||
        name.includes("market_flea")
    ){
        return "flea_market";
    }

    return "other";
}

async function importPointsToFirebase(){

    console.log("🚀 Початок імпорту точок...");

    for(let index = 0; index < points.length; index++){

        const point = points[index];

        const id =
            point.id ||
            `old_point_${index}`;

        /* ==========================================
           КАТЕГОРІЯ ВИЗНАЧАЄТЬСЯ ТІЛЬКИ ЗА ІКОНКОЮ
        ========================================== */

        const category =
            getCategoryFromIcon(point.icon);

        const pointData = {

            id:id,

            /* категорія автоматично */
            category:category,

            name:point.name || "",

            lat:Number(point.lat),

            lng:Number(point.lng),

            author:point.author || "",

            description:point.description || "",

            reviews:point.reviews || [],

            icon:point.icon || "maarket_map.svg"

        };

        try{

            await db
                .ref(`points/${category}/${id}`)
                .set(pointData);

            console.log(
                `✅ [${category}] ${id} — ${point.name} — ${point.icon}`
            );

        }

        catch(error){

            console.error(
                `❌ Помилка точки ${id}:`,
                error
            );

        }

    }

    console.log(
        "🎉 Імпорт завершено!"
    );

}
/* =====================================================
   ЗАВАНТАЖЕННЯ ВСІХ ТОЧОК З FIREBASE
   КАТЕГОРІЯ ВИЗНАЧАЄТЬСЯ ЗА ICON
===================================================== */

async function loadPointsByIcon(){

    try{

        const snapshot =
            await db.ref("points").once("value");

        if(!snapshot.exists()){

            console.log(
                "❌ У /points немає точок"
            );

            return [];

        }

        const result = [];

        /* ==========================================
           /points/category/point
        ========================================== */

        snapshot.forEach(categorySnapshot => {

            categorySnapshot.forEach(pointSnapshot => {

                const point =
                    pointSnapshot.val();

                if(!point){
                    return;
                }

                const lat =
                    Number(point.lat);

                const lng =
                    Number(point.lng);

                if(
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lng)
                ){

                    console.warn(
                        "⚠️ Некоректні координати:",
                        point
                    );

                    return;

                }

                /* ==================================
                   КАТЕГОРІЯ ЗА ІКОНКОЮ
                ================================== */

                const category =
                    getCategoryFromIcon(
                        point.icon
                    );

                result.push({

                    ...point,

                    id:
                        point.id ||
                        pointSnapshot.key,

                    lat:lat,

                    lng:lng,

                    category:category

                });

            });

        });

        console.log(
            `✅ Завантажено точок: ${result.length}`
        );

        console.log(
            "📂 Категорії:",
            result.map(p => ({
                id:p.id,
                icon:p.icon,
                category:p.category
            }))
        );

        return result;

    }

    catch(error){

        console.error(
            "❌ Помилка завантаження точок:",
            error
        );

        return [];

    }

}

===================================================== */

async function shareCurrentPoint(){

    if(!currentPointData){

        alert("Точку не вибрано.");

        return;
    }


    const lat =
        Number(currentPointData.lat);

    const lng =
        Number(currentPointData.lng);


    if(
        !Number.isFinite(lat) ||
        !Number.isFinite(lng)
    ){

        alert(
            "Координати точки некоректні."
        );

        return;
    }


    const name =
        currentPointData.name ||
        "Точка TruckPoint UA";


    /* Посилання Google Maps */

    const shareUrl =
        `https://www.google.com/maps?q=${lat},${lng}`;


    const shareText =
        `${name}\n` +
        `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}\n` +
        `${shareUrl}`;


    /* =================================================
       1. Мобільний телефон — системне меню Поділитися
    ================================================= */

    if(
        navigator.share &&
        typeof navigator.share === "function"
    ){

        try{

            await navigator.share({

                title:name,

                text:
                    `${name}\n` +
                    `📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`,

                url:shareUrl

            });

            console.log(
                "✅ Точку успішно передано."
            );

            return;

        }

        catch(error){

            /* Користувач просто закрив меню */

            if(
                error &&
                error.name === "AbortError"
            ){

                console.log(
                    "ℹ️ Поділитися скасовано."
                );

                return;

            }

            console.warn(
                "⚠️ Web Share недоступний:",
                error
            );

        }

    }


    /* =================================================
       2. Якщо Web Share немає — копіюємо посилання
    ================================================= */

    try{

        if(
            navigator.clipboard &&
            window.isSecureContext
        ){

            await navigator.clipboard.writeText(
                shareText
            );

            alert(
                "Посилання на точку скопійовано."
            );

            return;

        }

    }

    catch(error){

        console.warn(
            "⚠️ Clipboard не працює:",
            error
        );

    }


    /* =================================================
       3. Резервний варіант для старих браузерів
    ================================================= */

    try{

        const textarea =
            document.createElement("textarea");

        textarea.value =
            shareText;

        textarea.style.position =
            "fixed";

        textarea.style.left =
            "-9999px";

        textarea.style.top =
            "0";

        document.body.appendChild(
            textarea
        );

        textarea.focus();

        textarea.select();

        const copied =
            document.execCommand("copy");

        document.body.removeChild(
            textarea
        );


        if(copied){

            alert(
                "Посилання на точку скопійовано."
            );

            return;

        }

    }

    catch(error){

        console.warn(
            "⚠️ Резервне копіювання не працює:",
            error
        );

    }


    /* =================================================
       4. Останній варіант — показати посилання
    ================================================= */

    prompt(
        "Скопіюйте посилання на точку:",
        shareUrl
    );

}


/* =====================================================
   ЗАВАНТАЖИТИ ВІДГУКИ ТОЧКИ
===================================================== */

async function loadPointReviews(pointId) {

    try {

        if (!pointId) {
            console.warn(
                "⚠️ Не передано ID точки"
            );
            return;
        }


        /* ---------------------------------------------
           Контейнер відгуків
        --------------------------------------------- */

        const container =
            document.getElementById(
                "pointReviews"
            );


        if (!container) {

            console.error(
                "❌ Не знайдено контейнер #pointReviews"
            );

            return;
        }


        /* ---------------------------------------------
           Очищаємо список
        --------------------------------------------- */

        container.innerHTML = `
            <div style="
                text-align:center;
                padding:15px;
                color:#78909c;
            ">
                Завантаження відгуків...
            </div>
        `;


        /* ---------------------------------------------
           Відгуки знаходяться в БД ТОЧОК
           truckpointua-magazyny
        --------------------------------------------- */

        const snapshot =
            await db
                .ref(
                    "pointReviews/" +
                    pointId
                )
                .once("value");


        container.innerHTML = "";


        /* ---------------------------------------------
           Відгуків немає
        --------------------------------------------- */

        if (!snapshot.exists()) {

            container.innerHTML = `
                <div style="
                    text-align:center;
                    padding:20px;
                    color:#78909c;
                ">
                    Відгуків поки немає.
                </div>
            `;

            return;
        }


        /* ---------------------------------------------
           Формуємо список
        --------------------------------------------- */

        const reviews = [];


        snapshot.forEach(child => {

            const review =
                child.val() || {};

            reviews.push({

                id:
                    child.key,

                author:
                    review.author ||
                    "Користувач",

                userId:
                    review.userId ||
                    "",

                text:
                    review.text ||
                    "",

                createdAt:
                    review.createdAt ||
                    0

            });

        });


        /* ---------------------------------------------
           Нові відгуки зверху
        --------------------------------------------- */

        reviews.sort(
            (a, b) =>
                b.createdAt -
                a.createdAt
        );


        /* ---------------------------------------------
           Виводимо відгуки
        --------------------------------------------- */

        reviews.forEach(review => {

            const item =
                document.createElement("div");


            item.style.cssText = `
                background:#e8f1f5;
                border:1px solid #b0bec5;
                border-radius:12px;
                padding:12px;
                margin-bottom:10px;
                color:#263238;
            `;


            const date =
                review.createdAt
                    ? new Date(
                        review.createdAt
                    ).toLocaleString(
                        "uk-UA"
                    )
                    : "";


            item.innerHTML = `

                <div style="
                    display:flex;
                    justify-content:space-between;
                    align-items:center;
                    gap:10px;
                    margin-bottom:7px;
                ">

                    <div style="
                        font-weight:700;
                        color:#455a64;
                    ">
                        👤 ${escapeHtml(
                            review.author
                        )}
                    </div>

                    <div style="
                        font-size:11px;
                        color:#78909c;
                    ">
                        ${escapeHtml(date)}
                    </div>

                </div>


                <div style="
                    color:#37474f;
                    line-height:1.5;
                    white-space:pre-wrap;
                    word-break:break-word;
                ">
                    ${escapeHtml(
                        review.text
                    )}
                </div>

            `;


            container.appendChild(
                item
            );

        });


        console.log(
            `✅ Завантажено відгуків: ${reviews.length}`
        );


    } catch (error) {

        console.error(
            "❌ Помилка завантаження відгуків:",
            error
        );


        const container =
            document.getElementById(
                "pointReviews"
            );


        if (container) {

            container.innerHTML = `
                <div style="
                    color:#c62828;
                    text-align:center;
                    padding:15px;
                ">
                    Не вдалося завантажити відгуки.
                </div>
            `;
        }
    }
}


/* =====================================================
   БЕЗПЕЧНЕ ВИВЕДЕННЯ ТЕКСТУ
===================================================== */

function escapeHtml(value) {

    return String(value || "")
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
}

/* =====================================================
   ОТРИМАТИ ІМ'Я ПОТОЧНОГО КОРИСТУВАЧА
   КОРИСТУВАЧІ ЗБЕРІГАЮТЬСЯ В truckpoint-ua
===================================================== */

async function getCurrentUserName() {

    const user = firebase.auth().currentUser;

    if (!user) {
        return "Користувач";
    }

    try {

        const snap = await db
            .ref("users/" + user.uid)
            .once("value");

        if (snap.exists()) {

            const data = snap.val();

            const name =
                (data.name || "").trim();

            const surname =
                (data.surname || "").trim();

            const fullName =
                (name + " " + surname).trim();

            if (fullName) {
                return fullName;
            }

            if (name) {
                return name;
            }
        }

    } catch (error) {

        console.error(
            "❌ Помилка отримання профілю:",
            error
        );
    }

    return (
        user.displayName ||
        user.email ||
        "Користувач"
    );
}

/* =====================================================
   ШТОРКА — ПОВНЕ КЕРУВАННЯ ВГОРУ / ВНИЗ
===================================================== */

const sheet = document.getElementById("bottomSheet");
const handle = document.getElementById("sheetHandle");

const myLocationButtonElement =
    document.getElementById("myLocationButton");

const mapControlsElement =
    document.getElementById("mapControls");

const activeCategoryIconsElement =
    document.getElementById("activeCategoryIcons");


/* =========================
   НАЛАШТУВАННЯ
========================= */

const CLOSED_HEIGHT = 30;

let dragging = false;
let moved = false;

let startY = 0;
let startHeight = CLOSED_HEIGHT;


/* =========================
   ПОЧАТКОВИЙ СТАН
========================= */

sheet.style.height = CLOSED_HEIGHT + "px";
sheet.classList.remove("open");


/* =========================
   ВІДКРИТИ ШТОРКУ
========================= */

function openSheet(){

    sheet.classList.add("open");

    sheet.style.transition = "height .3s ease";

    sheet.style.height =
        window.innerHeight + "px";


    if(myLocationButtonElement){
        myLocationButtonElement.style.visibility = "hidden";
    }

    if(mapControlsElement){
        mapControlsElement.style.visibility = "hidden";
    }

    if(activeCategoryIconsElement){
        activeCategoryIconsElement.style.visibility = "hidden";
    }

}


/* =========================
   ЗАКРИТИ ШТОРКУ
========================= */

function closeSheet(){

    sheet.classList.remove("open");

    sheet.style.transition = "height .3s ease";

    sheet.style.height =
        CLOSED_HEIGHT + "px";


    if(myLocationButtonElement){
        myLocationButtonElement.style.visibility = "visible";
    }

    if(mapControlsElement){
        mapControlsElement.style.visibility = "visible";
    }

    if(activeCategoryIconsElement){
        activeCategoryIconsElement.style.visibility = "visible";
    }

}


/* =====================================================
   ПОЧАТОК ПЕРЕТЯГУВАННЯ
===================================================== */

handle.addEventListener("pointerdown", function(e){

    dragging = true;
    moved = false;

    startY = e.clientY;

    startHeight =
        sheet.getBoundingClientRect().height;


    /* прибираємо анімацію під час руху */

    sheet.style.transition = "none";


    /* дуже важливо для телефону */

    handle.setPointerCapture(e.pointerId);


    e.preventDefault();

});


/* =====================================================
   РУХ ШТОРКИ
===================================================== */

handle.addEventListener("pointermove", function(e){

    if(!dragging){
        return;
    }


    /*
       Якщо палець рухається ВГОРУ:
       startY - e.clientY стає позитивним
       => шторка збільшується.

       Якщо палець рухається ВНИЗ:
       startY - e.clientY стає негативним
       => шторка зменшується.
    */

    const movement =
        startY - e.clientY;


    if(Math.abs(movement) > 5){
        moved = true;
    }


    let newHeight =
        startHeight + movement;


    /* мінімум */

    newHeight =
        Math.max(
            CLOSED_HEIGHT,
            newHeight
        );


    /* максимум — весь екран */

    newHeight =
        Math.min(
            window.innerHeight,
            newHeight
        );


    /*
       Дозволяємо тягнути шторку
       на ЛЮБУ висоту.
    */

    sheet.style.height =
        newHeight + "px";


    e.preventDefault();

});

/* =====================================================
   ЗАВЕРШЕННЯ ПЕРЕТЯГУВАННЯ
===================================================== */

function finishSheetDrag(e){

    if(!dragging){
        return;
    }

    dragging = false;

    const currentHeight =
        sheet.getBoundingClientRect().height;

    const screenHeight =
        window.innerHeight;

    /* Поріг відкриття */

    if(currentHeight >= screenHeight * 0.5){

        /* Відкриваємо */

        sheet.classList.add("open");

        sheet.style.transition =
            "height .3s ease";

        sheet.style.height =
            "100dvh";

        if(myLocationButtonElement){
            myLocationButtonElement.style.visibility =
                "hidden";
        }

        if(mapControlsElement){
            mapControlsElement.style.visibility =
                "hidden";
        }

        if(activeCategoryIconsElement){
            activeCategoryIconsElement.style.visibility =
                "hidden";
        }

    }else{

        /* Закриваємо */

        sheet.classList.remove("open");

        sheet.style.transition =
            "height .3s ease";

        sheet.style.height =
            CLOSED_HEIGHT + "px";

        if(myLocationButtonElement){
            myLocationButtonElement.style.visibility =
                "visible";
        }

        if(mapControlsElement){
            mapControlsElement.style.visibility =
                "visible";
        }

        if(activeCategoryIconsElement){
            activeCategoryIconsElement.style.visibility =
                "visible";
        }

    }


    /* Відпускаємо pointer capture */

    if(
        e &&
        e.pointerId !== undefined &&
        handle.hasPointerCapture(e.pointerId)
    ){

        handle.releasePointerCapture(
            e.pointerId
        );

    }

}


/* =========================
   ВІДПУСКАННЯ ПАЛЬЦЯ / МИШІ
========================= */

handle.addEventListener(
    "pointerup",
    finishSheetDrag
);


handle.addEventListener(
    "pointercancel",
    finishSheetDrag
);


/* ===== СВАЙП ШТОРКИ ВНИЗ У БУДЬ-ЯКОМУ МІСЦІ ===== */

let touchStartY = 0;
let lastTouchY = 0;
let isSheetDragging = false;

sheet.addEventListener("touchstart", function(e) {

    if (e.touches.length !== 1) return;

    touchStartY = e.touches[0].clientY;
    lastTouchY = touchStartY;
    isSheetDragging = true;

    sheet.style.transition = "none";

}, { passive: true });


sheet.addEventListener("touchmove", function(e) {

    if (!isSheetDragging) return;

    const y = e.touches[0].clientY;
    const move = y - lastTouchY;

    if (move > 0) {

        const currentHeight = sheet.offsetHeight;

        sheet.style.height =
            Math.max(
                CLOSED_HEIGHT,
                currentHeight - move
            ) + "px";
    }

    lastTouchY = y;

}, { passive: true });


sheet.addEventListener("touchend", function() {

    if (!isSheetDragging) return;

    isSheetDragging = false;

    const totalMove =
        lastTouchY - touchStartY;

    sheet.style.transition =
        "height .3s ease";

    /* ===== ЗАКРИТИ ===== */

    if (totalMove > 70) {

        sheet.classList.remove("open");

        sheet.style.height =
            CLOSED_HEIGHT + "px";

        if (myLocationButtonElement) {
            myLocationButtonElement.style.visibility =
                "visible";
        }

        if (mapControlsElement) {
            mapControlsElement.style.visibility =
                "visible";
        }

        if (activeCategoryIconsElement) {
            activeCategoryIconsElement.style.visibility =
                "visible";
        }

    } else {

        /* Повернути шторку */
        sheet.style.height = "";

    }

});

/* =====================================================
   РОЗРАХУНОК ВІДСТАНІ
===================================================== */

function calculateDistanceKm(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLng =
        (lng2 - lng1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}



/* =====================================================
   ПРАВИЛЬНА ЛОГІКА ТОЧОК НА КАРТІ
===================================================== */

/*
   ЛОГІКА:

   • точки НЕ залежать від геолокації
   • точки залежать від центру карти
   • радіус = 20 км
   • точки показуються тільки активних категорій
   • при русі карти точки НЕ очищуються
   • нове завантаження тільки після зміщення >= 5 км
   • вже показані точки не створюються повторно
   • далекі точки видаляються
*/


/* =====================================================
   НАЛАШТУВАННЯ
===================================================== */

const POINTS_RADIUS_KM = 20;

/* після якого переміщення карти перевіряти нову область */
const RELOAD_DISTANCE_KM = 5;


/* =====================================================
   СТАН
===================================================== */

let pointMarkers = {};

let lastPointsCenter = null;

let pointsLoading = false;

let pointsReloadTimer = null;


/* =====================================================
   ВІДСТАНЬ МІЖ ДВОМА ТОЧКАМИ
===================================================== */

function distanceBetweenPoints(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLng =
        (lng2 - lng1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}

/* =====================================================
   ЧИ КАТЕГОРІЯ АКТИВНА
===================================================== */

function isCategoryActive(category){

    const shoppingButtons =
        document.querySelectorAll(
            "#shoppingCategories .subCategoryBtn"
        );

    const parkingButtons =
        document.querySelectorAll(
            "#parkingCategories .subCategoryBtn"
        );


    /* -------------------------
       Продуктові магазини
    ------------------------- */

    if(category === "market"){

        const button =
            document.querySelector(
                '#shoppingCategories button[onclick*="toggleGroceryStores"]'
            );

        return !!(
            button &&
            button.classList.contains("active")
        );

    }


    /* -------------------------
       Магазини ТІР
    ------------------------- */

    if(category === "truck_shop"){

        return !!(
            shoppingButtons[1] &&
            shoppingButtons[1].classList.contains("active")
        );

    }


    /* -------------------------
       Блошиний ринок
    ------------------------- */

    if(category === "flea_market"){

        return !!(
            shoppingButtons[2] &&
            shoppingButtons[2].classList.contains("active")
        );

    }


    /* -------------------------
       Промислова зона
    ------------------------- */

    if(category === "industrial"){

        return !!(
            parkingButtons[0] &&
            parkingButtons[0].classList.contains("active")
        );

    }


    /* -------------------------
       Паркування при дорозі
    ------------------------- */

    if(category === "road_parking"){

        return !!(
            parkingButtons[1] &&
            parkingButtons[1].classList.contains("active")
        );

    }


    /* -------------------------
       Інші типи паркування
    ------------------------- */

    if(category === "parking"){

        return !!(
            parkingButtons[2] &&
            parkingButtons[2].classList.contains("active")
        );

    }


    return false;

}

   СТВОРЕННЯ МАРКЕРА
===================================================== */

function createPointMarker(
    category,
    pointId,
    data,
    lat,
    lng
){

    const marker =
        L.marker(
            [lat,lng],
            {
                icon:
                    getCategoryIcon(
                        category,
                        data
                    )
            }
        );


    /* -------------------------
       Відкриття інформації
    ------------------------- */

    marker.on(
        "click",
        function(){

            openPointInfo(

                pointId,

                {

                    ...data,

                    id:pointId,

                    lat:lat,

                    lng:lng,

                    category:category

                }

            );

        }
    );


    return marker;

}


/* =====================================================
   ЗАВАНТАЖЕННЯ ОДНІЄЇ КАТЕГОРІЇ
===================================================== */

async function loadCategoryPoints(category){

    /* категорія НЕ активна */
    if(!isCategoryActive(category)){

        return;

    }


    const center =
        map.getCenter();


    try{

        console.log(
            "📡 Завантаження:",
            category
        );


        const snapshot =
            await db
                .ref("points/" + category)
                .once("value");


        if(!snapshot.exists()){

            console.log(
                "⚪ Немає точок:",
                category
            );

            return;

        }


        let added = 0;


        snapshot.forEach(child => {

            const data =
                child.val();


            if(!data){
                return;
            }


            /* -------------------------
               Координати
            ------------------------- */

            let lat =
                Number(
                    data.lat ??
                    data.latitude
                );


            let lng =
                Number(
                    data.lng ??
                    data.lon ??
                    data.longitude
                );


            if(
                !Number.isFinite(lat) ||
                !Number.isFinite(lng)
            ){

                return;

            }


            /* -------------------------
               Відстань від центру карти
            ------------------------- */

            const distance =
                distanceBetweenPoints(

                    center.lat,
                    center.lng,

                    lat,
                    lng

                );


            if(
                distance >
                POINTS_RADIUS_KM
            ){

                return;

            }


            /* -------------------------
               Унікальний ID
            ------------------------- */

            const pointId =
                category +
                "_" +
                child.key;


            /* -------------------------
               Якщо вже існує
            ------------------------- */

            if(pointMarkers[pointId]){

                return;

            }


            /* -------------------------
               Створюємо маркер
            ------------------------- */

            const marker =
                createPointMarker(

                    category,

                    pointId,

                    data,

                    lat,

                    lng

                );


            marker.addTo(map);


            pointMarkers[pointId] =
                {

                    marker:marker,

                    category:category,

                    lat:lat,

                    lng:lng

                };


            added++;

        });


        console.log(
            `✅ ${category}: додано ${added}`
        );

    }

    catch(error){

        console.error(
            "❌ Помилка:",
            category,
            error
        );

    }

}


/* =====================================================
   ВИДАЛЕННЯ ДАЛЕКИХ ТОЧОК
===================================================== */

function removeFarPoints(){

    const center =
        map.getCenter();


    Object.keys(pointMarkers)
        .forEach(pointId => {

            const item =
                pointMarkers[pointId];


            if(!item){
                return;
            }


            /* -------------------------
               Якщо категорія вже вимкнена
            ------------------------- */

            if(
                !isCategoryActive(
                    item.category
                )
            ){

                map.removeLayer(
                    item.marker
                );

                delete pointMarkers[
                    pointId
                ];

                return;

            }


            /* -------------------------
               Відстань
            ------------------------- */

            const distance =
                distanceBetweenPoints(

                    center.lat,
                    center.lng,

                    item.lat,
                    item.lng

                );


            /*
               Видаляємо тільки якщо
               точка вийшла далеко за межі
               радіуса.

               Робимо запас 5 км,
               щоб не було мерехтіння.
            */

            if(
                distance >
                POINTS_RADIUS_KM + RELOAD_DISTANCE_KM
            ){

                map.removeLayer(
                    item.marker
                );

                delete pointMarkers[
                    pointId
                ];

            }

        });

}


/* =====================================================
   ЗАВАНТАЖЕННЯ АКТИВНИХ КАТЕГОРІЙ
===================================================== */

async function loadActiveCategories(){

    if(pointsLoading){
        return;
    }


    pointsLoading = true;


    try{

        const categories = [

            "market",

            "truck_shop",

            "flea_market",

            "industrial",

            "road_parking",

            "parking",

            "wash",

            "gas_station",

            "restaurant",

            "hotel",

            "service",

            "tire",

            "truck_service"

        ];


        for(
            const category
            of categories
        ){

            if(
                isCategoryActive(
                    category
                )
            ){

                await loadCategoryPoints(
                    category
                );

            }

        }


        /* прибираємо старі */

        removeFarPoints();

    }

    finally{

        pointsLoading = false;

    }

}


/* =====================================================
   ПЕРЕВІРКА РУХУ КАРТИ
===================================================== */

function shouldReloadPoints(){

    if(!lastPointsCenter){

        return true;

    }


    const center =
        map.getCenter();


    const distance =
        distanceBetweenPoints(

            lastPointsCenter.lat,
            lastPointsCenter.lng,

            center.lat,
            center.lng

        );


    return (
        distance >=
        RELOAD_DISTANCE_KM
    );

}


/* =====================================================
   РУХ КАРТИ
===================================================== */

map.on(
    "moveend",
    function(){

        /*
           Якщо карта посунулась
           менше 5 км —
           НІЧОГО НЕ РОБИМО.
        */

        if(
            !shouldReloadPoints()
        ){

            return;

        }


        clearTimeout(
            pointsReloadTimer
        );


        pointsReloadTimer =
            setTimeout(
                async function(){

                    const center =
                        map.getCenter();


                    lastPointsCenter = {

                        lat:center.lat,

                        lng:center.lng

                    };


                    console.log(
                        "🗺 Нова область карти"
                    );


                    await loadActiveCategories();

                },
                300
            );

    }
);


/* =====================================================
   ЗАВАНТАЖЕННЯ КАТЕГОРІЇ ПРИ НАТИСКАННІ
===================================================== */

async function reloadCategory(category){

    /*
       Якщо категорію вимкнули —
       прибираємо її точки.
    */

    if(
        !isCategoryActive(
            category
        )
    ){

        Object.keys(pointMarkers)
            .forEach(id => {

                const item =
                    pointMarkers[id];


                if(
                    item.category ===
                    category
                ){

                    map.removeLayer(
                        item.marker
                    );

                    delete pointMarkers[
                        id
                    ];

                }

            });


        updateActiveCategoryIcons();

        return;

    }


    /*
       Якщо категорію увімкнули —
       завантажуємо її.
    */

    await loadCategoryPoints(
        category
    );


    updateActiveCategoryIcons();

}

/* =====================================================
   ОНОВЛЕННЯ ІКОНOК АКТИВНИХ КАТЕГОРІЙ
===================================================== */

function updateActiveCategoryIcons(){

    const container =
        document.getElementById(
            "activeCategoryIcons"
        );


    if(!container){
        return;
    }


    container.innerHTML = "";


    const icons = [

        {
            selector:
                '#shoppingCategories button[onclick*="toggleGroceryStores"]',

            image:
                "maarket_map.svg",

            title:
                "Продуктові магазини"
        },

        {
            selector:
                "#parkingCategories .subCategoryBtn:nth-child(1)",

            image:
                "promzona_map.svg",

            title:
                "Промислова зона"
        },

        {
            selector:
                "#parkingCategories .subCategoryBtn:nth-child(2)",

            image:
                "pocket_map.svg",

            title:
                "Паркування при дорозі"
        }

    ];


    icons.forEach(item => {

        const button =
            document.querySelector(
                item.selector
            );


        if(
            !button ||
            !button.classList.contains(
                "active"
            )
        ){

            return;

        }


        const img =
            document.createElement(
                "img"
            );


        img.src =
            item.image;


        img.title =
            item.title;


        img.className =
            "activeMapCategoryIcon";


        container.appendChild(
            img
        );

    });

}
