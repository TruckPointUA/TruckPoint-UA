<style>

*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Montserrat',sans-serif;
}

body{
    background:#edf3ff;
    min-height:100vh;
    padding-top:0;
}

body{
    background:#edf3ff;
    transition:background .4s ease;
}


/* =========================
   ДЕННИЙ РЕЖИМ
========================= */

body.day-mode .header{
    background:#ffffff;
    color:#111;

    border-bottom:1px solid rgba(0,123,255,.20);

    box-shadow:
        0 6px 18px rgba(0,0,0,.15),
        0 3px 12px rgba(0,123,255,.18);
}

body.day-mode .header::before{
    background:
        linear-gradient(
            90deg,
            rgba(0,153,255,.08),
            rgba(0,191,255,.03),
            rgba(0,153,255,.08)
        );
}

body.day-mode .logo{
    color:#111;
}

body.day-mode #userInfo > div > div:first-child{
    color:#087eff !important;
}

body.day-mode #headerUserName{
    color:#111 !important;
}

body.day-mode #headerStats{
    color:#111 !important;
    background:rgba(0,123,255,.10) !important;
    border:1px solid rgba(0,123,255,.15);
}

body.day-mode .bottomSheet{
    background:#ffffff;
    color:#111;

    box-shadow:
        0 -5px 18px rgba(0,0,0,.18);
}

body.day-mode .sheetHandle{
    background:#888;
}


/* =========================
   НІЧНИЙ РЕЖИМ
========================= */

body.night-mode{
    background:#080d14;
}

body.night-mode .header{
    background:#10151d;
    color:#fff;

    border-bottom:1px solid rgba(0,191,255,.25);

    box-shadow:
        0 8px 18px rgba(0,0,0,.55),
        0 3px 12px rgba(0,191,255,.20);
}

body.night-mode .header::before{
    background:
        linear-gradient(
            90deg,
            rgba(0,153,255,.12),
            rgba(0,191,255,.04),
            rgba(0,153,255,.12)
        );
}

body.night-mode .logo{
    color:#fff;
}

body.night-mode #userInfo > div > div:first-child{
    color:#00bfff !important;
}

body.night-mode #headerUserName{
    color:#fff !important;
}

body.night-mode #headerStats{
    color:#fff !important;
    background:rgba(0,191,255,.12) !important;
    border:1px solid rgba(0,191,255,.18);
}

body.night-mode .bottomSheet{
    background:#10151d;
    color:#fff;

    box-shadow:
        0 -5px 20px rgba(0,0,0,.55);
}

body.night-mode .sheetHandle{
    background:#777;
}

/* світловий фон */

.header::before{
    content:"";
    position:absolute;
    inset:0;

    background:
        linear-gradient(
            90deg,
            rgba(0,153,255,.10),
            rgba(0,191,255,.04),
            rgba(0,153,255,.10)
        );

    pointer-events:none;
}


/* фоновий логотип */

.header::after{
    content:"";

    position:absolute;

    right:18px;
    top:50%;

    transform:translateY(-50%);

    width:58px;
    height:58px;

    background:url("logo.png") center/contain no-repeat;

    opacity:.10;

    pointer-events:none;
}

/* Truck Point UA */

#userInfo > div > div:first-child{
    color:#00bfff !important;

    letter-spacing:1.5px !important;

    font-size:11px !important;

    font-weight:600;
}


/* =========================
   ТЕЛЕФОН
========================= */

@media(max-width:480px){

    }

        height:46px;
    }

}


/* =========================
   ОСНОВНА СТОРІНКА
========================= */

.container{
    max-width:600px;
    margin:auto;
    padding:15px;
}

#map{
    position:fixed;
    top:0;
    left:0;
    right:0;
    bottom:0;
    width:100%;
    z-index:1;
}

.bottomSheet{
    position:fixed;

    left:0;
    right:0;
    bottom:0;

    height:24px;

    background:#161b22;
    color:white;

    border-radius:16px 16px 0 0;

    z-index:20000;

    box-shadow:
        0 -4px 15px rgba(0,0,0,.35);

    overflow:hidden;

    transition:height .3s ease;

    touch-action:none;
}



.sheetHandle{
    width:100px;
    height:10px;

    background:#777;

    border-radius:10px;

    margin:8px auto;

    cursor:grab;

    touch-action:none;

    position:relative;
}

.sheetHandle::after{
    content:"";

    position:absolute;

    left:-30px;
    right:-30px;

    top:-18px;
    bottom:-18px;
}

.sheetContent{
    height:calc(100% - 30px);
    overflow-y:auto;
    overflow-x:hidden;
    padding:14px;

    -webkit-overflow-scrolling:touch;
}

.bottomSheet.open{
    height:100dvh;
    border-radius:0;

    z-index:99999;

    transition:height .3s ease;
}

.categoryScroll{
    display:flex;
    gap:10px;

    overflow-x:auto;
    overflow-y:hidden;

    padding:4px 12px 10px;

    white-space:nowrap;

    scrollbar-width:none;

    touch-action:pan-x;

    -webkit-overflow-scrolling:touch;
}

.categoryScroll::-webkit-scrollbar{
    display:none;
}

.categoryBtn{
    flex:0 0 auto;

    border:none;

    padding:13px 20px;

    border-radius:22px;

    background:#252d38;

    color:#fff;

    font-family:'Montserrat',sans-serif;

    font-size:16px;

    font-weight:700;

    box-shadow:0 4px 10px rgba(0,0,0,.25);

    cursor:pointer;

    white-space:nowrap;

    user-select:none;

    -webkit-user-select:none;
}

.categoryBtn:active{
    transform:scale(.95);
}

.subCategories{
    display:none;
    flex-direction:column;
    gap:14px;
    padding:8px 5px 25px;

.subCategories.show{

}

    color:#fff;

    font-weight:700;

    cursor:pointer;

    transition:.2s;
}

.subCategoryBtn:active{
    transform:scale(.98);

/* =========================
   ІКОНКИ ВИБРАНИХ КАТЕГОРІЙ
========================= */

#activeCategoriesBar{
    position:fixed;

    top:90px;
    left:10px;

    gap:8px;

    align-items:center;

}

/* одна іконка */

.activeCategoryIcon{
    width:42px;
    height:42px;

    flex:0 0 42px;

    display:flex;
    align-items:center;
    justify-content:center;

    border-radius:50%;

    background:rgba(16,21,29,.88);

    border:2px solid #00bfff;

    box-shadow:
        0 0 8px rgba(0,191,255,.65),
        0 0 18px rgba(0,191,255,.35);

    font-size:22px;

    animation:
        categoryBlink 1.2s infinite ease-in-out;
}

/* плавне блимання */

@keyframes categoryBlink{

    0%{
        opacity:.45;

        transform:scale(.92);

        box-shadow:
            0 0 5px rgba(0,191,255,.35);
    }

    50%{
        opacity:1;

        transform:scale(1.08);

        box-shadow:
            0 0 12px rgba(0,191,255,.9),
            0 0 25px rgba(0,191,255,.55);
    }

    100%{
        opacity:.45;

        transform:scale(.92);

        box-shadow:
            0 0 5px rgba(0,191,255,.35);
    }

}



/* телефон */

function getCategoryFromIcon(icon){

    const name = String(icon || "").toLowerCase();

    /* Продуктові магазини */
    if(
        name.includes("maarket") ||
        name.includes("market")
    ){
        return "market";
    }

    /* Паркування при дорозі */
    if(
        name.includes("pocket")
    ){
        return "road_parking";
    }

    /* Промислова зона */
    if(
        name.includes("promzona") ||
        name.includes("industrial")
    ){
        return "industrial";
    }

    /* Мийки */
    if(
        name.includes("wash") ||
        name.includes("miyka")
    ){
        return "wash";
    }

    /* АЗС */
    if(
        name.includes("gas") ||
        name.includes("azs") ||
        name.includes("fuel")
    ){
        return "gas_station";
    }

    /* Звичайне паркування */
    if(
        name.includes("parking")
    ){
        return "parking";
    }

    /* Магазини ТІР */
    if(
        name.includes("truck_shop") ||
        name.includes("tir_shop")
    ){
        return "truck_shop";
    }

    /* Блошиний ринок */
    if(
        name.includes("flea") ||
        name.includes("market_flea")
    ){
        return "flea_market";
    }

    return "other";
}

async function importPointsToFirebase(){

    console.log("🚀 Початок імпорту точок...");

    for(let index = 0; index < points.length; index++){

        const point = points[index];

        const id =
            point.id ||
            `old_point_${index}`;

        /* ==========================================
           КАТЕГОРІЯ ВИЗНАЧАЄТЬСЯ ТІЛЬКИ ЗА ІКОНКОЮ
        ========================================== */

        const category =
            getCategoryFromIcon(point.icon);

        const pointData = {

            id:id,

            /* категорія автоматично */
            category:category,

            name:point.name || "",

            lat:Number(point.lat),

            lng:Number(point.lng),

            author:point.author || "",

            description:point.description || "",

            reviews:point.reviews || [],

            icon:point.icon || "maarket_map.svg"

        };

        try{

            await db
                .ref(`points/${category}/${id}`)
                .set(pointData);

            console.log(
                `✅ [${category}] ${id} — ${point.name} — ${point.icon}`
            );

        }

        catch(error){

            console.error(
                `❌ Помилка точки ${id}:`,
                error
            );

        }

    }

    console.log(
        "🎉 Імпорт завершено!"
    );

}

===================================================== */

async function loadPointsByIcon(){

    try{

        const snapshot =
            await db.ref("points").once("value");

        if(!snapshot.exists()){

            console.log(
                "❌ У /points немає точок"
            );

            return [];

        }

        const result = [];

        /* ==========================================
           /points/category/point
        ========================================== */

        snapshot.forEach(categorySnapshot => {

            categorySnapshot.forEach(pointSnapshot => {

                const point =
                    pointSnapshot.val();

                if(!point){
                    return;
                }

                const lat =
                    Number(point.lat);

                const lng =
                    Number(point.lng);

                if(
                    !Number.isFinite(lat) ||
                    !Number.isFinite(lng)
                ){

                    console.warn(
                        "⚠️ Некоректні координати:",
                        point
                    );

                    return;

                }

                /* ==================================
                   КАТЕГОРІЯ ЗА ІКОНКОЮ
                ================================== */

                const category =
                    getCategoryFromIcon(
                        point.icon
                    );

                result.push({

                    ...point,

                    id:
                        point.id ||
                        pointSnapshot.key,

                    lat:lat,

                    lng:lng,

                    category:category

                });

            });

        });

        console.log(
            `✅ Завантажено точок: ${result.length}`
        );

        console.log(
            "📂 Категорії:",
            result.map(p => ({
                id:p.id,
                icon:p.icon,
                category:p.category
            }))
        );

        return result;

    }

    catch(error){

        console.error(
            "❌ Помилка завантаження точок:",
            error
        );

        return [];

    }

}

function shareCurrentPoint(){

    if(!currentPointData){
        alert("Точку не вибрано.");
        return;
    }

    const lat = Number(currentPointData.lat);
    const lng = Number(currentPointData.lng);

    const name =
        currentPointData.name ||
        "Точка TruckPoint UA";

    const shareUrl =
        `https://www.google.com/maps?q=${lat},${lng}`;

    const shareText =
        `${name}\n📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}\n${shareUrl}`;

    /* Якщо телефон підтримує Web Share */

    if(navigator.share){

        navigator.share({

            title:name,

            text:
                `${name}\n📍 ${lat.toFixed(6)}, ${lng.toFixed(6)}`,

            url:shareUrl

        }).catch(error => {

            console.log(
                "Поділитися скасовано:",
                error
            );

        });

        return;
    }


    /* Якщо Web Share не підтримується */

    navigator.clipboard.writeText(shareText)

        .then(() => {

            alert(
                "Посилання на точку скопійовано."
            );

        })

        .catch(() => {

            prompt(
                "Скопіюйте посилання:",
                shareUrl
            );

        });

}

/* =========================
   ВІДГУКИ
========================= */

function loadPointReviews(pointId){

    const container =
        document.getElementById(
            "pointReviews"
        );


    container.innerHTML = `
        <div class="noReviews">
            Завантаження відгуків...
        </div>
    `;


    db.ref(
        "pointReviews/" + pointId
    )
    .orderByChild("createdAt")
    .once("value")
    .then(snapshot => {

        container.innerHTML = "";


        if(!snapshot.exists()){

            container.innerHTML = `
                <div class="noReviews">
                    Поки що відгуків немає.
                    Будьте першим!
                </div>
            `;

            return;
        }


        const reviews = [];


        snapshot.forEach(child => {

            reviews.push({
                id:child.key,
                ...child.val()
            });

        });


        /* Нові зверху */

        reviews.reverse();


        reviews.forEach(review => {

            const item =
                document.createElement("div");

            item.className =
                "reviewItem";


            const author =
                document.createElement("div");

            author.className =
                "reviewAuthor";

            author.textContent =
                "👤 " +
                (
                    review.author ||
                    "Користувач"
                );


            const date =
                document.createElement("div");

            date.className =
                "reviewDate";


            if(review.createdAt){

                date.textContent =
                    new Date(
                        review.createdAt
                    ).toLocaleString(
                        "uk-UA"
                    );

            }


            const text =
                document.createElement("div");

            text.className =
                "reviewText";

            text.textContent =
                review.text || "";


            item.appendChild(author);

            item.appendChild(date);

            item.appendChild(text);

            container.appendChild(item);

        });

    })
    .catch(error => {

        console.error(
            "Помилка завантаження відгуків:",
            error
        );

        container.innerHTML = `
            <div class="noReviews">
                Не вдалося завантажити відгуки.
            </div>
        `;

    });

}

function addPointReview(){

    if(!currentPointId){

        alert("Точку не вибрано.");

        return;

    const textarea =
        document.getElementById(
            "reviewText"
        );


    const text =
        textarea.value.trim();


    if(!text){

        alert(
            "Напишіть текст відгуку."
        );

        textarea.focus();

        return;
    }




    const reviewRef =
        db.ref(
            "pointReviews/" +
            currentPointId
        )
        .push();


    const review = {

        author:
            currentUserName ||
            "Користувач",

        userId:
            USER_ID,

        text:
            text,

        createdAt:
            firebase.database.ServerValue.TIMESTAMP

    };


    reviewRef
    .set(review)
    .then(() => {

        textarea.value = "";

        loadPointReviews(
            currentPointId
        );

    })
    .catch(error => {

        console.error(
            "Помилка додавання відгуку:",
            error
        );

        alert(
            "Не вдалося додати відгук."
        );

    });

}

/* =====================================================
   ШТОРКА — ПОВНЕ КЕРУВАННЯ ВГОРУ / ВНИЗ
===================================================== */

const sheet = document.getElementById("bottomSheet");
const handle = document.getElementById("sheetHandle");

const myLocationButtonElement =
    document.getElementById("myLocationButton");

const mapControlsElement =
    document.getElementById("mapControls");

const activeCategoryIconsElement =
    document.getElementById("activeCategoryIcons");


/* =========================
   НАЛАШТУВАННЯ
========================= */

const CLOSED_HEIGHT = 30;

let dragging = false;
let moved = false;

let startY = 0;
let startHeight = CLOSED_HEIGHT;


/* =========================
   ПОЧАТКОВИЙ СТАН
========================= */

sheet.style.height = CLOSED_HEIGHT + "px";
sheet.classList.remove("open");


/* =========================
   ВІДКРИТИ ШТОРКУ
========================= */

function openSheet(){

    sheet.classList.add("open");

    sheet.style.transition = "height .3s ease";

    sheet.style.height =
        window.innerHeight + "px";


    if(myLocationButtonElement){
        myLocationButtonElement.style.visibility = "hidden";
    }

    if(mapControlsElement){
        mapControlsElement.style.visibility = "hidden";
    }

    if(activeCategoryIconsElement){
        activeCategoryIconsElement.style.visibility = "hidden";
    }

}


/* =========================
   ЗАКРИТИ ШТОРКУ
========================= */

function closeSheet(){

    sheet.classList.remove("open");

    sheet.style.transition = "height .3s ease";

    sheet.style.height =
        CLOSED_HEIGHT + "px";


    if(myLocationButtonElement){
        myLocationButtonElement.style.visibility = "visible";
    }

    if(mapControlsElement){
        mapControlsElement.style.visibility = "visible";
    }

    if(activeCategoryIconsElement){
        activeCategoryIconsElement.style.visibility = "visible";
    }

}


/* =====================================================
   ПОЧАТОК ПЕРЕТЯГУВАННЯ
===================================================== */

handle.addEventListener("pointerdown", function(e){

    dragging = true;
    moved = false;

    startY = e.clientY;

    startHeight =
        sheet.getBoundingClientRect().height;


    /* прибираємо анімацію під час руху */

    sheet.style.transition = "none";


    /* дуже важливо для телефону */

    handle.setPointerCapture(e.pointerId);


    e.preventDefault();

});


/* =====================================================
   РУХ ШТОРКИ
===================================================== */

handle.addEventListener("pointermove", function(e){

    if(!dragging){
        return;
    }


    /*
       Якщо палець рухається ВГОРУ:
       startY - e.clientY стає позитивним
       => шторка збільшується.

       Якщо палець рухається ВНИЗ:
       startY - e.clientY стає негативним
       => шторка зменшується.
    */

    const movement =
        startY - e.clientY;


    if(Math.abs(movement) > 5){
        moved = true;
    }


    let newHeight =
        startHeight + movement;


    /* мінімум */

    newHeight =
        Math.max(
            CLOSED_HEIGHT,
            newHeight
        );


    /* максимум — весь екран */

    newHeight =
        Math.min(
            window.innerHeight,
            newHeight
        );


    /*
       Дозволяємо тягнути шторку
       на ЛЮБУ висоту.
    */

    sheet.style.height =
        newHeight + "px";


    e.preventDefault();

});

/* =====================================================
   ЗАВЕРШЕННЯ ПЕРЕТЯГУВАННЯ
===================================================== */

function finishSheetDrag(e){

    if(!dragging){
        return;
    }

    dragging = false;

    const currentHeight =
        sheet.getBoundingClientRect().height;

    const screenHeight =
        window.innerHeight;

    /* Поріг відкриття */

    if(currentHeight >= screenHeight * 0.5){

        /* Відкриваємо */

        sheet.classList.add("open");

        sheet.style.transition =
            "height .3s ease";

        sheet.style.height =
            "100dvh";

        if(myLocationButtonElement){
            myLocationButtonElement.style.visibility =
                "hidden";
        }

        if(mapControlsElement){
            mapControlsElement.style.visibility =
                "hidden";
        }

        if(activeCategoryIconsElement){
            activeCategoryIconsElement.style.visibility =
                "hidden";
        }

    }else{

        /* Закриваємо */

        sheet.classList.remove("open");

        sheet.style.transition =
            "height .3s ease";

        sheet.style.height =
            CLOSED_HEIGHT + "px";

        if(myLocationButtonElement){
            myLocationButtonElement.style.visibility =
                "visible";
        }

        if(mapControlsElement){
            mapControlsElement.style.visibility =
                "visible";
        }

        if(activeCategoryIconsElement){
            activeCategoryIconsElement.style.visibility =
                "visible";
        }

    }


    /* Відпускаємо pointer capture */

    if(
        e &&
        e.pointerId !== undefined &&
        handle.hasPointerCapture(e.pointerId)
    ){

        handle.releasePointerCapture(
            e.pointerId
        );

    }

}


/* =========================
   ВІДПУСКАННЯ ПАЛЬЦЯ / МИШІ
========================= */

handle.addEventListener(
    "pointerup",
    finishSheetDrag
);


handle.addEventListener(
    "pointercancel",
    finishSheetDrag
);


/* ===== СВАЙП ШТОРКИ ВНИЗ ===== */


let touchStartY = 0;
let lastTouchY = 0;
let isSheetDragging = false;

sheet.addEventListener("touchstart", function(e) {

    if (e.touches.length !== 1) return;

    touchStartY = e.touches[0].clientY;
    lastTouchY = touchStartY;
    isSheetDragging = true;

    sheet.style.transition = "none";

}, { passive: true });


sheet.addEventListener("touchmove", function(e) {

    if (!isSheetDragging) return;

    const y = e.touches[0].clientY;
    const move = y - lastTouchY;

    /* Тільки рух вниз */
    if (move > 0) {

        const currentHeight = sheet.offsetHeight;

        sheet.style.height =
            Math.max(
                CLOSED_HEIGHT,
                currentHeight - move
            ) + "px";
    }

    lastTouchY = y;

}, { passive: true });


sheet.addEventListener("touchend", function() {

    if (!isSheetDragging) return;

    isSheetDragging = false;

    const totalMove =
        lastTouchY - touchStartY;

    sheet.style.transition =
        "height .3s ease";

    /* ===== ЗАКРИВАЄМО ===== */

    if (totalMove > 70) {

        sheet.classList.remove("open");

        sheet.style.height =
            CLOSED_HEIGHT + "px";

        if (myLocationButtonElement) {
            myLocationButtonElement.style.visibility =
                "visible";
        }

        if (mapControlsElement) {
            mapControlsElement.style.visibility =
                "visible";
        }

        if (activeCategoryIconsElement) {
            activeCategoryIconsElement.style.visibility =
                "visible";
        }

    } 
    
    /* ===== НЕ ДОТЯГНУЛИ — ПОВЕРТАЄМО ===== */

    else {

        sheet.style.height = "";

    }

});


/* =====================================================
   ПОВОРОТ ТЕЛЕФОНУ / ЗМІНА РОЗМІРУ
===================================================== */

window.addEventListener("resize", function(){

    /*
       Якщо шторка повністю відкрита —
       вона завжди займає весь новий екран.
    */

    if(sheet.classList.contains("open")){

        sheet.style.height =
            window.innerHeight + "px";

    }else{

        /*
           Закрита шторка завжди 24 px.
        */

        sheet.style.height =
            CLOSED_HEIGHT + "px";

    }

});

===================================================== */

function calculateDistanceKm(
    lat1,
    lng1,
    lat2,
    lng2
){

    const R = 6371;

    const dLat =
        (lat2 - lat1) *
        Math.PI / 180;

    const dLng =
        (lng2 - lng1) *
        Math.PI / 180;

    const a =
        Math.sin(dLat / 2) *
        Math.sin(dLat / 2) +

        Math.cos(
            lat1 * Math.PI / 180
        ) *

        Math.cos(
            lat2 * Math.PI / 180
        ) *

        Math.sin(dLng / 2) *
        Math.sin(dLng / 2);

    const c =
        2 *
        Math.atan2(
            Math.sqrt(a),
            Math.sqrt(1 - a)
        );

    return R * c;
}

function getDistanceMeters(lat1, lng1, lat2, lng2) {

// ============================================================
// ДИНАМІЧНЕ ЗАВАНТАЖЕННЯ ТОЧОК ЗА ЦЕНТРОМ КАРТИ
// Геолокація НЕ використовується
// Радіус: 20 км
// Без мерехтіння точок при русі карти
// ============================================================

const POINTS_RADIUS_KM = 20;

// Останній центр, для якого реально виконувалось завантаження
let lastLoadedCenter = null;

// Чи виконується зараз завантаження

// Таймер після руху карти

// Відстань, після якої дозволяємо нове завантаження
// 5 км — щоб не перезавантажувати точки при кожному русі
const RELOAD_DISTANCE_KM = 5;


// ------------------------------------------------------------
// Відстань між двома координатами
// ------------------------------------------------------------
function distanceBetweenPoints(lat1, lon1, lat2, lon2) {

    const R = 6371;

    const dLat = (lat2 - lat1) * Math.PI / 180;
    const dLon = (lon2 - lon1) * Math.PI / 180;

    const a =
        Math.sin(dLat / 2) * Math.sin(dLat / 2) +
        Math.cos(lat1 * Math.PI / 180) *
        Math.cos(lat2 * Math.PI / 180) *
        Math.sin(dLon / 2) *
        Math.sin(dLon / 2);

    const c = 2 * Math.atan2(Math.sqrt(a), Math.sqrt(1 - a));

    return R * c;
}


// ------------------------------------------------------------
// Перевірка: чи потрібно завантажувати точки
// ------------------------------------------------------------
function shouldReloadPoints() {

    if (!lastLoadedCenter) {
        return true;
    }

    const center = map.getCenter();

    const distance = distanceBetweenPoints(
        lastLoadedCenter.lat,
        lastLoadedCenter.lng,
        center.lat,
        center.lng
    );

    return distance >= RELOAD_DISTANCE_KM;
}

// ------------------------------------------------------------
// Завантаження всіх категорій точок
// ------------------------------------------------------------
async function loadPointsForMapCenter() {

    if (pointsLoading) {
        return;
    }

    if (!map) {
        return;
    }

    const center = map.getCenter();

    console.log(
        "📍 Центр карти:",
        center.lat.toFixed(6),
        center.lng.toFixed(6)
    );

    console.log(
        "📡 Завантаження точок у радіусі",
        POINTS_RADIUS_KM,
        "км"
    );

    pointsLoading = true;

    try {

        // Запам'ятовуємо центр
        lastLoadedCenter = {
            lat: center.lat,
            lng: center.lng
        };


        // ----------------------------------------------------
        // СПИСОК КАТЕГОРІЙ
        // ----------------------------------------------------

        const pointCategories = [

            "road_parking",
            "parking",
            "market",
            "wash",
            "gas_station",
            "industrial",
            "restaurant",
            "hotel",
            "service",
            "tire",
            "truck_service"

        ];


        // ----------------------------------------------------
        // Завантажуємо кожну категорію
        // ----------------------------------------------------

        for (const category of pointCategories) {

            try {

                console.log(
                    "📡 Завантаження:",
                    "points/" + category
                );

                const snapshot =
                    await firebase.database()
                        .ref("points/" + category)
                        .once("value");


                if (!snapshot.exists()) {

                    console.log(
                        "⚪ points/" + category +
                        ": даних немає"
                    );

                    continue;
                }


                let shown = 0;
                let rejected = 0;


                snapshot.forEach(child => {

                    const data = child.val();

                    if (!data) {
                        return;
                    }


                    // ----------------------------------------
                    // Визначення координат
                    // ----------------------------------------

                    let lat = parseFloat(
                        data.lat ??
                        data.latitude
                    );

                    let lng = parseFloat(
                        data.lng ??
                        data.lon ??
                        data.longitude
                    );


                    // Якщо координати лежать всередині location
                    if (
                        (!Number.isFinite(lat) ||
                         !Number.isFinite(lng)) &&
                        data.location
                    ) {

                        lat = parseFloat(
                            data.location.lat ??
                            data.location.latitude
                        );

                        lng = parseFloat(
                            data.location.lng ??
                            data.location.lon ??
                            data.location.longitude
                        );
                    }


                    // Немає координат
                    if (
                        !Number.isFinite(lat) ||
                        !Number.isFinite(lng)
                    ) {

                        console.warn(
                            "⚠️ Немає координат:",
                            child.key,
                            data
                        );

                        return;
                    }


                    // ----------------------------------------
                    // Перевірка відстані ВІД ЦЕНТРУ КАРТИ
                    // ----------------------------------------

                    const distance = distanceBetweenPoints(
                        center.lat,
                        center.lng,
                        lat,
                        lng
                    );


                    if (distance > POINTS_RADIUS_KM) {

                        rejected++;

                        return;
                    }


                    // ----------------------------------------
                    // Створення маркера
                    // ----------------------------------------

                    const pointId =
                        category + "_" + child.key;


                    // Якщо маркер вже існує —
                    // НЕ створюємо його повторно
                    if (
                        window.pointMarkers &&
                        window.pointMarkers[pointId]
                    ) {

                        return;
                    }


                    // Створюємо сховище маркерів
                    if (!window.pointMarkers) {
                        window.pointMarkers = {};
                    }


                    // ----------------------------------------
                    // Іконка
                    // ----------------------------------------

                    let icon = null;

                    if (
                        typeof getCategoryIcon === "function"
                    ) {

                        icon =
                            getCategoryIcon(
                                category,
                                data
                            );
                    }


                    // Запасна іконка
                    if (!icon) {

                        icon = L.divIcon({

                            className:
                                "custom-point-marker",

                            html:
                                "📍",

                            iconSize: [
                                35,
                                35
                            ],

                            iconAnchor: [
                                17,
                                35
                            ]

                        });
                    }


                    // ----------------------------------------
                    // Створюємо Leaflet marker
                    // ----------------------------------------

                    const marker = L.marker(
                        [lat, lng],
                        {
                            icon: icon
                        }
                    );


// ========================================
// ВІДКРИТТЯ ПОВНОЇ ІНФОРМАЦІЇ ПРО ТОЧКУ
// ========================================

marker.on("click", function(){

    openPointInfo(
        pointId,
        {
            ...data,
            id: pointId,
            lat: lat,
            lng: lng,
            category: category
        }
    );

});

                    marker.on("click", function(){

    openPointInfo(
        pointId,
        {
            ...data,
            id: pointId,
            lat: lat,
            lng: lng,
            category: category
        }
    );

});


                    // ----------------------------------------
                    // Додаємо на карту
                    // ----------------------------------------

                    marker.addTo(map);


                    // Зберігаємо
                    window.pointMarkers[pointId] =
                        marker;


                    shown++;

                });


                console.log(
                    `✅ points/${category}: ` +
                    `показано ${shown} точок`
                );

                console.log(
                    `⛔ points/${category}: ` +
                    `відкинуто ${rejected} точок`
                );


            } catch (error) {

                console.error(
                    "❌ Помилка категорії:",
                    category,
                    error
                );

            }

        }


    } catch (error) {

        console.error(
            "❌ Помилка завантаження точок:",
            error
        );

    } finally {

        pointsLoading = false;

    }

}

function toggleParking(){

        document.getElementById("parkingCategories");

        document.getElementById("shoppingCategories");

        document.querySelectorAll(".categoryScroll .categoryBtn");

    const shoppingButton = buttons[0];
    const parkingButton = buttons[1];

    /* Якщо Паркування вже відкриті — закриваємо */

        parking.classList.remove("show");

        parkingButton.classList.remove("active");
