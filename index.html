<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Вхід - TruckPoint UA</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#0d1117;
color:white;
height:100vh;
display:flex;
justify-content:center;
align-items:center;
}

.login-box{

width:90%;
max-width:420px;
background:#161b22;
padding:35px;
border-radius:20px;
box-shadow:0 0 25px #0099ff55;

}

.logo{

text-align:center;
font-size:38px;
font-weight:700;
color:#00bfff;
margin-bottom:20px;

}

h2{
text-align:center;
margin-bottom:25px;
}


input{

width:100%;
padding:15px;
margin-bottom:15px;
border-radius:12px;
border:none;
font-size:16px;

}


button{

width:100%;
padding:15px;
border:none;
border-radius:12px;
background:#0099ff;
color:white;
font-size:18px;
cursor:pointer;

}


button:hover{

background:#0077cc;

}


.register{

text-align:center;
margin-top:20px;

}


.register a{

color:#00bfff;
text-decoration:none;

}

</style>

</head>

<body>


<div class="login-box">


<div class="logo">
TruckPoint UA
</div>


<h2>🔑 Вхід</h2>


<input id="email" type="email" placeholder="Email">


<input id="password" type="password" placeholder="Пароль">


<button onclick="login()">
Увійти
</button>


<div class="register">

Новий користувач?

<br>

<a href="Реєстрація.html">
📝 Створити акаунт
</a>

</div>


</div>



<script>

const firebaseConfig = {
  apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",
  authDomain: "truckpoint-ua.firebaseapp.com",
  databaseURL: "https://truckpoint-ua-default-rtdb.firebaseio.com",
  projectId: "truckpoint-ua",
  storageBucket: "truckpoint-ua.firebasestorage.app",
  messagingSenderId: "992372126132",
  appId: "1:992372126132:web:3378b6b1794066132d42e1"
};

firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();
const db = firebase.database();



auth.onAuthStateChanged((user) => {
    if (user) {
        window.location.replace("Головна.html");
    }
});


function login() {

    const email = document.getElementById("email").value;
    const password = document.getElementById("password").value;

    auth.signInWithEmailAndPassword(email, password)

    .then(async (userCredential) => {

        const uid = userCredential.user.uid;

        const snap = await db.ref("users/" + uid).once("value");

   if (snap.exists()) {

    const user = snap.val();

    localStorage.setItem("userName", user.name || "");
    localStorage.setItem("userSurname", user.surname || "");

}

        window.location.href = "Головна.html";

    })

    .catch((error) => {
        console.log(error);
        alert(error.code + "\n" + error.message);
    });

}

</script>


</body>
</html>
