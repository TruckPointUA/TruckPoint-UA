<script>


// ===============================

const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL: "https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId: "truckpoint-ua",

messagingSenderId: "992372126132",

appId: "1:992372126132:web:3378b6b1794066132d42e1"

};


firebase.initializeApp(firebaseConfig);


const auth = firebase.auth();

const db = firebase.database();



let USER_ID="";

const dialogs = document.getElementById("dialogs");

const messageSound = new Audio("message.mp3");
messageSound.preload = "auto";

// ===============================
// АВТОРИЗАЦІЯ
// ===============================




function setOnlineStatus() {

    if (!USER_ID) return;

    const ref = db.ref("online/" + USER_ID);

    function update() {

        ref.set({
            online: true,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        });

    }

    update();

    setInterval(update, 20000);

    ref.onDisconnect().set({
        online: false,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
    });

    document.addEventListener("visibilitychange", () => {

        if (document.hidden) {

            ref.update({
                online: false,
                lastSeen: firebase.database.ServerValue.TIMESTAMP
            });

        } else {

            update();

        }

    });

    window.addEventListener("beforeunload", () => {

        ref.update({
            online: false,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        });

    });

}
auth.onAuthStateChanged(user=>{
if(user){


USER_ID=user.uid;

setOnlineStatus();


loadDialogs();
loadMenuUser();

}else{


auth.signInAnonymously();


}


});


function setOnline() {

    if (!USER_ID) return;

    const ref = db.ref("online/" + USER_ID);

    function update() {

        ref.update({
            online: true,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        });

    }

    update();

    setInterval(update, 30000);

    ref.onDisconnect().update({
        online: false,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
    });

}

// ===============================
// ЗАВАНТАЖЕННЯ ЧАТІВ
// ===============================


function loadUserDialog(uid, chatId, chat) {

    db.ref("users/" + uid).once("value").then(snap => {

        let user = snap.val() || {};

        let div = document.createElement("div");
        div.className = "dialog";

        div.onclick = () => {
            localStorage.setItem("chatId", chatId);
            localStorage.setItem("chatUser", uid);
            location.href = "Чат.html";
        };

        let time = "";

        if (chat.lastTime) {
            let d = new Date(chat.lastTime);

            time =
                String(d.getHours()).padStart(2, "0") +
                ":" +
                String(d.getMinutes()).padStart(2, "0");
        }

        dialogs.appendChild(div);

        loadUnread(chatId);

        // Оновлення статусу користувача
       db.ref("usersLocation/" + uid).on("value", onlineSnap => {

    const loc = onlineSnap.val() || {};

    const isOnline =
        loc.online === true &&
        Date.now() - (loc.lastUpdate || 0) < 120000;

    let status = "";

    if (isOnline) {

        status = "🟢 Онлайн";

    } else if (loc.lastUpdate) {

        const d = new Date(loc.lastUpdate);
        const now = new Date();

        if (d.toDateString() === now.toDateString()) {

            status =
                "Був(ла) сьогодні о " +
                d.getHours().toString().padStart(2, "0") +
                ":" +
                d.getMinutes().toString().padStart(2, "0");

        } else {

            status =
                "Був(ла) " +
                d.getDate().toString().padStart(2, "0") +
                "." +
                (d.getMonth() + 1).toString().padStart(2, "0") +
                "." +
                d.getFullYear() +
                " о " +
                d.getHours().toString().padStart(2, "0") +
                ":" +
                d.getMinutes().toString().padStart(2, "0");

        }

    } else {

        status = "⚪ Не в мережі";

    }

    div.innerHTML = `
        <div class="avatar">
            <img src="${user.avatar || 'avatars/avatar1.png'}">
        </div>

        <div class="info">
            <div class="name">
                ${user.name || "Користувач"} ${user.surname || ""}
            </div>

            <div class="last">
                ${status}
            </div>
        </div>

        <div class="time">
            ${time}
        </div>

        <div id="badge-${chatId}" class="badge" style="display:none"></div>
    `;

    loadUnread(chatId);

});
    });

}

function loadDialogs() {

    dialogs.innerHTML = "";

    db.ref("chats")
        .orderByChild("lastTime")
        .on("value", snap => {

            dialogs.innerHTML = "";

            let chats = [];

            snap.forEach(item => {

                const chat = item.val();

                // показувати тільки чати поточного користувача
                if (chat.members && chat.members[USER_ID]) {

                    chats.push({
                        id: item.key,
                        data: chat
                    });

                }

            });

            // нові зверху
            chats.reverse();

            chats.forEach(chat => {

                let otherUser = "";

                Object.keys(chat.data.members).forEach(uid => {
                    if (uid !== USER_ID) {
                        otherUser = uid;
                    }
                });

                if (otherUser) {
                    loadUserDialog(otherUser, chat.id, chat.data);
                }

            });

        });

}
// ===============================
// НОВИЙ ЧАТ
// ===============================


// ===============================
// СПИСОК КОРИСТУВАЧІВ
// ===============================


function openUsers(){


document.getElementById(
"usersWindow"
).style.display="block";


loadUsers();


}



function closeUsers(){


document.getElementById(
"usersWindow"
).style.display="none";


}

function loadUsers(){


let list=document.getElementById(
"usersList"
);


list.innerHTML="";



// спочатку друзі

db.ref("friends/"+USER_ID)

.once("value")

.then(friendSnap=>{


let friends=[];


friendSnap.forEach(f=>{

friends.push(f.key);

});



loadAllUsers(friends);



});


}

function loadAllUsers(friends){


let list=document.getElementById(
"usersList"
);

list.innerHTML="";


db.ref("users")

.once("value")

.then(snapshot=>{


let users=[];



snapshot.forEach(item=>{


let uid=item.key;

let user=item.val();



if(uid===USER_ID)
return;



users.push({

uid:uid,

data:user,

friend:
friends.includes(uid)

});


});



// друзі зверху

users.sort((a,b)=>{

return b.friend-a.friend;

});



users.forEach(u=>{


let div=document.createElement("div");


div.style.cssText=`

height:70px;
display:flex;
align-items:center;
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;
`;



div.innerHTML=`

<img src="${u.data.avatar || 'avatars/avatar1.png'}"

style="
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
margin-right:12px;
">


<div>

<b style="
color:${u.friend ? '#1677ff' : '#222'};
">

${u.friend ? "🤝 Друг • " : ""}

${u.data.name || "Користувач"}

${u.data.surname || ""}

</b>

</div>

`;



div.onclick=()=>{

checkBlocked(u.uid);

};



list.appendChild(div);



});


});


}
function checkBlocked(uid){


db.ref(
"blocked/"+USER_ID+"/"+uid
)

.once("value")

.then(snap=>{


if(snap.exists()){


alert(
"Ви заблокували цього користувача"
);


return;


}



createChat(uid);



});


}
function createChat(uid){

let chatId=[USER_ID,uid]
.sort()
.join("_");


db.ref("chats/"+chatId)
.update({

created:
firebase.database.ServerValue.TIMESTAMP,

lastTime:
firebase.database.ServerValue.TIMESTAMP,

lastMessage:"Новий чат",

members:{

[USER_ID]:true,

[uid]:true

}

})
.then(()=>{


localStorage.setItem(
"chatId",
chatId
);


localStorage.setItem(
"chatUser",
uid
);


location.href="Чат.html";


});


}
document.getElementById(
"userSearch"
)

.addEventListener(
"input",
function(){


let value=this.value.toLowerCase();



document.querySelectorAll(
"#usersList div"
)

.forEach(u=>{


u.style.display=

u.innerText
.toLowerCase()
.includes(value)

?

"flex"

:

"none";



});


});

const unreadCache = {};

function loadUnread(chatId){

    db.ref("chats/"+chatId+"/unread/"+USER_ID)
    .on("value",snap=>{

        let count = snap.val() || 0;

        let badge = document.getElementById("badge-"+chatId);

        if(!badge) return;

        // звук тільки коли кількість збільшилась
        if(
            unreadCache[chatId] !== undefined &&
            count > unreadCache[chatId]
        ){
            messageSound.currentTime = 0;
            messageSound.play().catch(()=>{});
        }

        unreadCache[chatId] = count;

        if(count>0){
            badge.style.display="flex";
            badge.textContent=count;
        }else{
            badge.style.display="none";
        }

    });

}

function loadChats(){

let list=document.getElementById("chatList");

list.innerHTML="";


db.ref("chats")

.orderByChild("lastTime")

.on("value",snapshot=>{


list.innerHTML="";


let chats=[];


snapshot.forEach(chat=>{


let data=chat.val();


if(data.members && data.members[USER_ID]){


chats.unshift({

id:chat.key,

data:data

});


}


});



chats.forEach(chat=>{


let otherUser="";


Object.keys(chat.data.members)

.forEach(uid=>{


if(uid!==USER_ID){

otherUser=uid;

}


});



loadChatUser(

chat.id,

otherUser,

chat.data,

list

);



});


});


}

function loadChatUser(
chatId,
uid,
chat,
list
){


db.ref("users/"+uid)

.once("value")

.then(snap=>{


let u=snap.val()||{};



let div=document.createElement("div");


div.className="chatItem";


let count =
chat.unread &&
chat.unread[USER_ID]
?
chat.unread[USER_ID]
:
0;

let typing=false;


db.ref(
"typing/"+chatId+"/"+uid
)

.on("value",s=>{


typing=s.val()||false;



let last =
div.querySelector(".lastMsg");



if(last && typing){

last.textContent=
"✍️ друкує...";


}


});

div.innerHTML=`

<img class="chatAvatar"

src="${u.avatar || 
'avatars/avatar1.png'}">


<div class="chatInfo">


<div class="chatName">

${u.name || "Користувач"}

${u.online ?
'<span class="onlineDot">🟢</span>'
:
''}


</div>


<div class="lastMsg">

${chat.lastMessage || ""}

</div>


<div style="
font-size:12px;
color:#999;
">

${formatTime(chat.lastTime)}

</div>


</div>


${count>0?

`
<div class="badge">
${count}
</div>
`
:
''
}



`;



div.onclick=()=>{


localStorage.setItem(
"chatId",
chatId
);


localStorage.setItem(
"chatUser",
uid
);


location.href="Чат.html";


};



list.appendChild(div);



});


}

function formatTime(time){


if(!time)
return "";


let d=new Date(time);


let now=new Date();



if(
d.toDateString()===now.toDateString()
){

return d.getHours()
.toString()
.padStart(2,"0")
+
":"
+
d.getMinutes()
.toString()
.padStart(2,"0");


}


return d.getDate()
+
"."
+
(d.getMonth()+1);



}
const sideMenu =
document.getElementById("sideMenu");


const menuOverlay =
document.getElementById("menuOverlay");



function toggleMenu(){


sideMenu.classList.toggle("open");


menuOverlay.classList.toggle("open");


}



menuOverlay.onclick=function(){

toggleMenu();

};



function loadMenuUser(){


db.ref("users/"+USER_ID)

.once("value")

.then(snap=>{


let u=snap.val()||{};


document.getElementById("menuName")
.textContent =
(u.name || "Користувач")
+" "
+(u.surname || "");



document.getElementById("menuEmail")
.textContent =
u.email || "";



document.getElementById("menuAvatar")
.src =
u.avatar ||
"avatars/avatar1.png";


});


}


function openOnlineUsers(){

document.getElementById("onlineWindow").style.display="block";

loadOnlineUsers();

}



function closeOnlineUsers(){

document.getElementById("onlineWindow").style.display="none";

}



function loadOnlineUsers(){

let list=document.getElementById("onlineList");

list.innerHTML="Завантаження...";


db.ref("online").on("value",onlineSnap=>{


list.innerHTML="";


db.ref("users").once("value")
.then(usersSnap=>{


usersSnap.forEach(userSnap=>{


let uid=userSnap.key;


// не показувати себе
if(uid===USER_ID)
return;



let onlineData =
onlineSnap.child(uid).val();


// показуємо тільки активних
if(
    !onlineData ||
    onlineData.online !== true ||
    Date.now() - (onlineData.lastSeen || 0) > 60000
){
    return;
}



let u=userSnap.val() || {};



let div=document.createElement("div");


div.style.cssText=`

height:75px;
display:flex;
align-items:center;
padding:10px;
border-bottom:1px solid #eee;
cursor:pointer;

`;



div.innerHTML=`

<img src="${u.avatar || 'avatars/avatar1.png'}"

style="
width:55px;
height:55px;
border-radius:50%;
object-fit:cover;
margin-right:12px;
">


<div>

<b>
🟢 ${u.name || "Користувач"}
${u.surname || ""}
</b>

<br>

<small>
Онлайн зараз
</small>

</div>

`;



div.onclick=()=>{

createChat(uid);

};



list.appendChild(div);



});


});


});


}

function deleteChat(chatId,event){

// щоб не відкривався чат
event.stopPropagation();


if(!confirm("Видалити цей чат?"))
return;


db.ref("chats/"+chatId)

function createDiscussion() {

    let isFriends = confirm(
        "Натисніть OK — щоб створити обговорення між друзями.\n\n" +
        "Натисніть Скасувати — щоб створити обговорення для всіх користувачів."
    );

    let type = isFriends ? "friends" : "public";

    // Тема
    let topic = prompt("Введіть тему чату:");
    if (!topic) return;

    // Назва
    let title = prompt("Введіть назву чату:");
    if (!title) return;

    // Питання
    let question = prompt("Введіть запитання для обговорення:");
    if (!question) return;

    let id = "topic_" + Date.now();

    db.ref("topics/" + id).set({

        topic: topic,
        title: title,
        question: question,

        creator: USER_ID,
        type: type,

        created: firebase.database.ServerValue.TIMESTAMP

    }).then(() => {

        // Створюємо запис чату
        return db.ref("chats/" + id).set({

            isTopic: true,

            members: {
                [USER_ID]: true
            },

            topic: topic,
            title: title,
            question: question,

            lastMessage: question,
            lastTime: firebase.database.ServerValue.TIMESTAMP,

            creator: USER_ID,
            type: type

        });

    }).then(() => {

        localStorage.setItem("chatId", id);
        localStorage.setItem("chatUser", "topic");

        location.href = "Чат.html";

    });

}
