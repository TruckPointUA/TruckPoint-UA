<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Головна</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-storage-compat.js"></script>
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600;700&display=swap" rel="stylesheet">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

body{
background:#edf3ff;
min-height:100vh;
}


header{
background:linear-gradient(135deg,#0057ff,#00a2ff);
color:white;
padding:20px;
border-radius:0 0 25px 25px;
box-shadow:0 5px 15px #0003;
text-align:center;
}

.logo{
font-size:28px;
font-weight:700;
}

.user{
margin-top:8px;
font-size:15px;
font-weight:500;
}



.container{

padding:15px;
max-width:600px;
margin:auto;

}



.grid{

display:grid;
grid-template-columns:repeat(2,1fr);
gap:12px;
margin-top:15px;

}



.card{

background:white;
border-radius:18px;
height:130px;
display:flex;
flex-direction:column;
justify-content:center;
align-items:center;
box-shadow:0 6px 15px #0002;
cursor:pointer;
transition:.2s;
-webkit-tap-highlight-color:transparent;

}



.card:active{

transform:scale(.96);

}



.icon{

font-size:38px;

}



.title{

margin-top:8px;
font-size:15px;
font-weight:600;
text-align:center;

}



/* Телефон */

@media(max-width:480px){


header{

padding:16px;

}


.logo{

font-size:23px;

}


.grid{

grid-template-columns:1fr;
gap:12px;

}



.card{

height:95px;
flex-direction:row;
justify-content:flex-start;
padding-left:25px;

}



.icon{

font-size:35px;
width:60px;

}



.title{

font-size:16px;
margin-top:0;

}


}


/* Планшет */

@media(min-width:700px){


.container{

max-width:750px;

}


.card{

height:150px;

}


}

.card,
.card *{
    user-select: none;
    -webkit-user-select: none;
    -moz-user-select: none;
    -ms-user-select: none;
}

.usersModal{
position:fixed;
inset:0;
background:rgba(0,0,0,.45);
display:none;
justify-content:center;
align-items:center;
z-index:99999;
}

.usersWindow{

width:95%;
max-width:500px;
height:80vh;
background:#fff;
border-radius:20px;
overflow:hidden;
display:flex;
flex-direction:column;
box-shadow:0 20px 40px rgba(0,0,0,.3);

}

.usersHeader{

padding:18px;
background:linear-gradient(135deg,#0d6efd,#00a2ff);
color:#fff;
display:flex;
justify-content:space-between;
align-items:center;

}

.usersHeader button{

border:none;
background:white;
color:#0d6efd;
width:36px;
height:36px;
border-radius:50%;
font-size:18px;
cursor:pointer;

}

#userSearch{

margin:15px;
padding:12px;
border-radius:12px;
border:1px solid #ccc;
font-size:15px;

}

#usersList{

flex:1;
overflow:auto;
padding:10px;

}

.userItem{

display:flex;
align-items:center;
justify-content:space-between;
background:#f7f9ff;
padding:12px;
border-radius:15px;
margin-bottom:10px;
box-shadow:0 3px 8px rgba(0,0,0,.08);

}

.userLeft{

display:flex;
align-items:center;
gap:12px;

}

.userLeft img{

width:55px;
height:55px;
border-radius:50%;
object-fit:cover;

}

.userName{

font-weight:600;
font-size:15px;

}

.userStatus{

font-size:13px;
color:#666;

}

.addFriend{

background:#0d6efd;
color:#fff;
border:none;
padding:10px 15px;
border-radius:10px;
cursor:pointer;
font-weight:600;

}

.addFriend:disabled{

background:#999;
cursor:default;

}
</style>

</head>


<body>


<header>

<div class="logo">
TruckPoint UA
</div>

<div class="user" id="userInfo">
👤 Завантаження...
</div>

</header>



<div class="container">

<div class="grid">


<div class="card" onclick="location.href='Точки зацікавленості.html'">
<div class="icon">🗺️</div>
<div class="title">Точки Зацікавленості</div>
</div>

<div class="card" onclick="location.href='Для відпочинку.html'">
<div class="icon">☕</div>
<div class="title">Для відпочинку</div>
</div>

<div class="card" onclick="location.href='https://for-driver.info/ua/traffic-ban.html'">
<div class="icon">⚠️</div>
<div class="title">Заборони руху</div>
</div>

<div class="card" onclick="location.href='Користувачі.html'">
    <div class="icon">📡</div>
    <div class="title">Користувачі на мапі</div>
</div>

<div class="card" onclick="openUsersModal()">
    <div class="icon">👥</div>
    <div class="title">Усі користувачі</div>
</div>

<div class="card" onclick="location.href='Коментарі.html'">
    <div class="icon">💬</div>
    <div class="title">Додати коментар</div>
</div>

<div class="card" onclick="openSettings()">
<div class="icon">⚙️</div>
<div class="title">Налаштування</div>
</div>

<div class="card" onclick="logout()">
<div class="icon">🚪</div>
<div class="title">Вийти</div>
</div>


</div>

</div>

<div id="settingsModal" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:9999;">

<div style="background:#fff;width:92%;max-width:380px;border-radius:20px;padding:20px;box-shadow:0 10px 35px rgba(0,0,0,.25);max-height:90vh;overflow:auto;">

<h2 style="text-align:center;margin-bottom:15px;color:#0d6efd;">
⚙️ Налаштування
</h2>

<div style="text-align:center;margin-bottom:18px;">

<img id="avatarPreview"
src="avatars/avatar1.png"
style="width:90px;height:90px;border-radius:50%;border:4px solid #0d6efd;object-fit:cover;">
<input
type="file"
id="avatarFile"
accept="image/*"
style="display:none"
onchange="uploadAvatar()">

<button onclick="document.getElementById('avatarFile').click()">
📷 Обрати фото
</button>

<br><br>

<button onclick="chooseAvatar()"
style="background:#0d6efd;color:#fff;border:none;padding:10px 18px;border-radius:10px;cursor:pointer;">
🖼️ Змінити аватар
</button>


</div>

<label><b>Ім'я</b></label>

<input id="newName"
type="text"
style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:8px 0 15px;">

<label><b>Прізвище</b></label>

<input id="newSurname"
type="text"
style="width:100%;padding:12px;border-radius:12px;border:1px solid #ccc;margin:8px 0 20px;">

<button onclick="saveProfile()"
style="width:100%;padding:13px;background:#0d6efd;color:white;border:none;border-radius:12px;font-size:16px;font-weight:bold;">
💾 Зберегти
</button>

<button onclick="closeSettings()"
style="width:100%;padding:13px;background:#ececec;border:none;border-radius:12px;font-size:16px;margin-top:10px;">
❌ Закрити
</button>

</div>

</div>
<div id="avatarSelect" style="display:none;position:fixed;inset:0;background:rgba(0,0,0,.55);justify-content:center;align-items:center;z-index:10000;">

<div style="background:white;border-radius:20px;padding:20px;width:92%;max-width:420px;">

<h3 style="text-align:center;margin-bottom:15px;">
🖼️ Оберіть аватар
</h3>

<div id="avatarsGrid"
style="display:grid;grid-template-columns:repeat(4,1fr);gap:12px;">
</div>

<button onclick="closeAvatarPicker()"
style="width:100%;margin-top:20px;padding:12px;border:none;border-radius:10px;background:#ddd;">
Закрити
</button>

</div>

</div>

<div class="usersModal" id="usersModal">

    <div class="usersWindow">

        <div class="usersHeader">

            <h2>👥 Усі користувачі</h2>

            <button onclick="closeUsersModal()">✕</button>

        </div>

        <input
            id="userSearch"
            placeholder="Пошук..."
            oninput="filterUsers()">

        <div id="usersList"></div>

    </div>

</div>
<script>


const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL: "https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId: "truckpoint-ua",

storageBucket: "truckpoint-ua.firebasestorage.app",

messagingSenderId: "992372126132",

appId: "1:992372126132:web:3378b6b1794066132d42e1"

};


if(!firebase.apps.length){

firebase.initializeApp(firebaseConfig);

}


const auth = firebase.auth();
const db = firebase.database();
let USER_ID = "";

firebase.auth().onAuthStateChanged(user => {

    if (!user) {

        window.location.replace("index.html");
        return;

    }

    USER_ID = user.uid;

    // далі твій код...
});
let selectedAvatar = "";

firebase.auth().onAuthStateChanged(user=>{


if(!user){

    window.location.replace("index.html");
    return;

}


db.ref("users/" + user.uid).once("value").then(snapshot=>{


let name = "Користувач";


if(snapshot.exists()){

    const data = snapshot.val();
    selectedAvatar = data.avatar || "avatars/avatar1.png";


    if(data.name && data.surname){

        name = data.name + " " + data.surname;

    }
    else if(data.name){

        name = data.name;

    }

}

else if(localStorage.getItem("userName")){

    name = localStorage.getItem("userName");

}
else if(user.displayName){

    name = user.displayName;

}


// ---------- Онлайн + геолокація ----------

const USER_ID = firebase.auth().currentUser.uid;

const showLocation =
    localStorage.getItem("showLocation") !== "false";

const connectedRef = db.ref(".info/connected");

connectedRef.on("value", (snap) => {

    if (!snap.val()) return;

    // При втраті з'єднання або закритті браузера
    db.ref("usersLocation/" + USER_ID)
        .onDisconnect()
        .update({
            online: false,
            lastUpdate: firebase.database.ServerValue.TIMESTAMP
        });

    if (!showLocation || !navigator.geolocation) return;

    // Одразу отримуємо координати
    navigator.geolocation.getCurrentPosition((position) => {

        db.ref("usersLocation/" + USER_ID).set({

            name: name,
            lat: position.coords.latitude,
            lng: position.coords.longitude,
            online: true,
            showLocation: true,
            lastUpdate: Date.now()

        });

    });

    // Постійне оновлення координат
    let watchId = navigator.geolocation.watchPosition((position) => {

        db.ref("usersLocation/" + USER_ID).update({

            lat: position.coords.latitude,
            lng: position.coords.longitude,
            online: true,
            showLocation: true,
            lastUpdate: Date.now()

        });

    }, console.error, {

        enableHighAccuracy: true,
        maximumAge: 5000,
        timeout: 10000

    });
    // Підтримувати статус онлайн, навіть якщо користувач не рухається
setInterval(() => {

    db.ref("usersLocation/" + USER_ID).update({
        online: true,
        lastUpdate: Date.now()
    });

}, 30000);

});



// шапка

function updateHeader() {

    db.ref("users").once("value").then(usersSnap => {

        const usersCount = usersSnap.numChildren();

        db.ref("usersLocation").once("value").then(locationSnap => {

            let onlineCount = 0;

            locationSnap.forEach(child => {

                const d = child.val();

                if (
                    d.online === true &&
                    d.showLocation === true &&
                    Date.now() - (d.lastUpdate || 0) < 120000
                ) {
                    onlineCount++;
                }

            });

 const avatar =
selectedAvatar || "avatars/avatar1.png";

document.getElementById("userInfo").innerHTML = `
<div style="display:flex;align-items:center;justify-content:center;gap:10px">

<img src="${avatar}"
style="width:50px;height:50px;border-radius:50%;object-fit:cover">

<div>
<b>${name}</b><br>
👥 ${usersCount} | 🟢 ${onlineCount}
</div>

</div>`;

        });

    });

}


updateHeader();

setInterval(updateHeader,10000);


});


});

function openSettings(){

    const user = firebase.auth().currentUser;

    if(!user) return;

    db.ref("users/"+user.uid).once("value").then(snap=>{

        const d = snap.val() || {};
        selectedAvatar = d.avatar || "";

if(selectedAvatar){

    document.getElementById("avatarPreview").src =
        selectedAvatar;

}

        document.getElementById("newName").value =
            d.name || "";

        document.getElementById("newSurname").value =
            d.surname || "";

        selectedAvatar =
d.avatar || "";
            localStorage.setItem("userAvatar", selectedAvatar);
            if(selectedAvatar){
    document.getElementById("avatarPreview").src=selectedAvatar;
}

       document.getElementById("avatarPreview").src = selectedAvatar;

        document.getElementById("settingsModal").style.display="flex";

    });

}

function closeSettings(){

    document.getElementById("settingsModal").style.display="none";

}
function logout() {

    const USER_ID = firebase.auth().currentUser.uid;

    db.ref("usersLocation/" + USER_ID).update({

        online: false,
        lastUpdate: Date.now()

    }).finally(() => {
if (watchId) {

    navigator.geolocation.clearWatch(watchId);

}
        auth.signOut();

    });

}


function chooseAvatar(){

    const grid=document.getElementById("avatarsGrid");

    grid.innerHTML="";

    for(let i=1;i<=10;i++){

        const img=document.createElement("img");

        img.src="avatars/avatar"+i+".png";

        img.style.width="70px";
        img.style.height="70px";
        img.style.borderRadius="50%";
        img.style.cursor="pointer";
        img.style.border="3px solid transparent";

   img.onclick=function(){

    selectedAvatar="avatars/avatar"+i+".png";

    document.getElementById("avatarPreview").src=selectedAvatar;

    closeAvatarPicker();

};

        grid.appendChild(img);

    }

    document.getElementById("avatarSelect").style.display="flex";

}

function closeAvatarPicker(){

    document.getElementById("avatarSelect").style.display="none";

}

function saveProfile(){

    const user=firebase.auth().currentUser;

    if(!user) return;

    const name=document.getElementById("newName").value.trim();

    const surname=document.getElementById("newSurname").value.trim();

    if(name.length<2){

        alert("Введіть ім'я");

        return;

    }

    db.ref("users/"+user.uid).update({

        name:name,
        surname:surname,
        avatar:selectedAvatar

    }).then(()=>{

        localStorage.setItem("userName",name);
        localStorage.setItem("userSurname",surname);
        localStorage.setItem("userAvatar",selectedAvatar);
        document.getElementById("avatarPreview").src = selectedAvatar;

        const USER_ID=localStorage.getItem("USER_ID");

        if(USER_ID){

            db.ref("usersLocation/"+USER_ID).update({

                name:name+" "+surname

            });

        }

        db.ref("friendCodes")
        .orderByChild("uid")
        .equalTo(user.uid)
        .once("value")
        .then(snapshot=>{

            snapshot.forEach(child=>{

                child.ref.update({

                    name:name+" "+surname

                });

            });

        });

        closeSettings();

        updateHeader();

    });

}


function uploadAvatar(){

    const file = document.getElementById("avatarFile").files[0];

    if(!file) return;

    const reader = new FileReader();

    reader.onload = function(e){

        const img = new Image();

        img.onload = function(){

            const canvas = document.createElement("canvas");

            const size = 200;

            canvas.width = size;
            canvas.height = size;

            const ctx = canvas.getContext("2d");

            ctx.drawImage(img,0,0,size,size);

            selectedAvatar =
                canvas.toDataURL("image/jpeg",0.8);
                console.log(selectedAvatar);

            document.getElementById("avatarPreview").src =
                selectedAvatar;

        };

        img.src = e.target.result;

    };

    reader.readAsDataURL(file);

}

// ================================
// УСІ КОРИСТУВАЧІ
// ================================

let allUsers = [];
let friends = {};
let pending = {};

function openUsersModal(){
    document.getElementById("usersModal").style.display = "flex";
    loadAllUsers();
}

function closeUsersModal(){
    document.getElementById("usersModal").style.display = "none";
}

function loadAllUsers(){

    const me = firebase.auth().currentUser;
    if(!me) return;

    Promise.all([
        db.ref("friends/"+me.uid).once("value"),
        db.ref("friendRequests/"+me.uid).once("value"),
        db.ref("users").once("value"),
        db.ref("usersLocation").once("value")
    ]).then(([friendsSnap, requestsSnap, usersSnap, locationSnap])=>{

        friends = friendsSnap.val() || {};
        pending = requestsSnap.val() || {};

        const online = {};

        locationSnap.forEach(c=>{
            online[c.key]=c.val();
        });

        allUsers=[];

        usersSnap.forEach(child=>{

            if(child.key===me.uid) return;

            const d = child.val() || {};

            allUsers.push({
                uid: child.key,
                name: ((d.name||"")+" "+(d.surname||"")).trim(),
                avatar: d.avatar || "avatars/avatar1.png",
                online: online[child.key]?.online === true
            });

        });

        renderUsers();

    });

}

function renderUsers(){

    const list=document.getElementById("usersList");

    list.innerHTML="";

    allUsers.sort((a,b)=>a.name.localeCompare(b.name));

    allUsers.forEach(user=>{

        const div=document.createElement("div");
        div.className="userItem";

        let btn="";

        if(friends[user.uid]){

            btn='<button class="addFriend" disabled>✔ Друг</button>';

        }else if(pending[user.uid]){

            btn='<button class="addFriend" disabled>⏳ Запит</button>';

        }else{

            btn=`
            <button class="addFriend"
            onclick="addFriend('${user.uid}','${user.name}')">
            ➕ Додати
            </button>`;
        }

        div.innerHTML=`

        <div class="userLeft"
        onclick="showUserProfile('${user.uid}')"
        style="cursor:pointer">

            <img src="${user.avatar}">

            <div>

                <div class="userName">
                    ${user.name}
                </div>

                <div class="userStatus">
                    ${user.online ? "🟢 Онлайн":"⚪ Офлайн"}
                </div>

            </div>

        </div>

        ${btn}
        `;

        list.appendChild(div);

    });

}

function addFriend(friendUid,friendName){

    const me=firebase.auth().currentUser;

    if(!me) return;

    const currentName=
        (
            (localStorage.getItem("userName")||"")+
            " "+
            (localStorage.getItem("userSurname")||"")
        ).trim();

    const currentAvatar=
        localStorage.getItem("userAvatar") ||
        "avatars/avatar1.png";

    db.ref("friendRequests/"+friendUid+"/"+me.uid).set({

        uid:me.uid,
        name:currentName,
        avatar:currentAvatar,
        time:Date.now()

    }).then(()=>{

        pending[friendUid]=true;

        renderUsers();

    });

}

function filterUsers(){

    const text=document.getElementById("userSearch")
    .value.toLowerCase();

    document.querySelectorAll(".userItem").forEach(card=>{

        const name=card.querySelector(".userName")
        .innerText.toLowerCase();

        card.style.display=
        name.includes(text)
        ?"flex":"none";

    });

}

document.getElementById("usersModal").onclick=function(e){

    if(e.target===this){

        closeUsersModal();

    }

};

function showUserProfile(uid){

    db.ref("users/"+uid).once("value").then(s=>{

        const d=s.val()||{};

        alert(
            "👤 "+((d.name||"")+" "+(d.surname||"")).trim()+
            "\n\nТелефон: "+(d.phone||"не вказано")
        );

    });

}

setInterval(()=>{

    if(document.getElementById("usersModal").style.display==="flex"){

        loadAllUsers();

    }

},10000);

function showUserProfile(uid){

    db.ref("users/"+uid).once("value").then(s=>{

        const d=s.val()||{};

        alert(

"👤 "+(d.name||"")+" "+(d.surname||"")+

"\n\nТелефон: "+(d.phone||"не вказано")

        );

    });

}
</script>


</body>
</html>
