<script>

const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL: "https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId: "truckpoint-ua",

storageBucket: "truckpoint-ua.firebasestorage.app",

messagingSenderId: "992372126132",

appId: "1:992372126132:web:3378b6b1794066132d42e1"

};

firebase.initializeApp(firebaseConfig);
const db = firebase.database();
const auth = firebase.auth();
let currentUserName = "Водій";



let USER_ID = null;

let showLocation =
localStorage.getItem("showLocation") !== "false";

const map=L.map("map").setView([49.0,31.0],6);

map.zoomControl.remove();

const googleMap=L.tileLayer(

"https://mt1.google.com/vt/lyrs=m&x={x}&y={y}&z={z}",

{

maxZoom:20

}

).addTo(map);

const googleHybrid=L.tileLayer(

"https://mt1.google.com/vt/lyrs=y&x={x}&y={y}&z={z}",

{

maxZoom:20

}

);

let currentLayer=googleMap;

document.getElementById("layerBtn").onclick=()=>{

map.removeLayer(currentLayer);

if(currentLayer===googleMap){

currentLayer=googleHybrid;

map.addLayer(currentLayer);

document.getElementById("layerBtn").innerHTML="🛰️";

}else{

currentLayer=googleMap;

map.addLayer(currentLayer);

document.getElementById("layerBtn").innerHTML="🗺️";

}

};

const truckIcon=L.divIcon({

className:"",

html:`

<div style="

font-size:28px;

filter:drop-shadow(0 0 5px black);

">

🚛

</div>

`,

iconSize:[30,30],

iconAnchor:[15,15]

});

const userMarkers = {};
const usersLayer = L.layerGroup().addTo(map);
let myFriends = {};

function loadMyFriends(){

db.ref("friends/"+USER_ID).on("value",snap=>{

    myFriends = {};

    snap.forEach(friend=>{

        myFriends[friend.key]=true;

    });


    loadUsers();

});

}

function loadUsers(){

db.ref("usersLocation").on("value",snap=>{

    const activeUsers = {};

snap.forEach(child=>{

const id = child.key;
const user = child.val();


// показуємо тільки себе і друзів

if(
id !== USER_ID &&
!myFriends[id]
){
    return;
}

        if(!user.showLocation){

    if(userMarkers[id]){
        usersLayer.removeLayer(userMarkers[id]);
        delete userMarkers[id];
    }

    return;
}

        activeUsers[id] = true;

      const offlineAfter = 5 * 60 * 1000; // 5 хвилин

const isOnline =
    user.showLocation &&
    (Date.now() - (user.lastUpdate || 0) < offlineAfter);

const status = isOnline
    ? "🟢 Онлайн"
    : "🔴 Офлайн";

const lastSeen = new Date(user.lastUpdate).toLocaleString("uk-UA");

        if(userMarkers[id]){

            userMarkers[id].setLatLng([user.lat,user.lng]);

            userMarkers[id].setTooltipContent(user.name);

            userMarkers[id].setPopupContent(`
            <div style="text-align:center">
            <b>${user.name}</b><br><br>
           ${status}<br>
${isOnline
    ? `🟢 Зараз онлайн`
    : `🕒 Був онлайн: ${lastSeen}`}
            </div>
            `);

        }else{
if (
    typeof user.lat !== "number" ||
    typeof user.lng !== "number"
) {
    console.log("Некоректний запис:", id, user);
    return;
}
            const marker = L.marker(
                [user.lat,user.lng],
                {icon:truckIcon}
            );

            marker.bindTooltip(user.name,{
                permanent:true,
                direction:"top",
                offset:[0,-18],
                className:"userLabel"
            });

            marker.bindPopup(`
            <div style="text-align:center">
            <b>${user.name}</b><br><br>
       ${status}<br>
${isOnline
    ? `🟢 Зараз онлайн`
    : `🕒 Був онлайн: ${lastSeen}`}
            </div>
            `);

            marker.addTo(usersLayer);

            userMarkers[id]=marker;
        }

    });

    Object.keys(userMarkers).forEach(id=>{

        if(!activeUsers[id]){

            usersLayer.removeLayer(userMarkers[id]);

            delete userMarkers[id];

        }

    });

});

}

loadUsers();

let myMarker=null;

// тут вже НЕМАЄ sendLocation()


auth.onAuthStateChanged(async (user) => {

    if (!user) {
        window.location.href = "index.html";
        return;
    }

    USER_ID = user.uid;

    loadMyFriends();

    listenFriendRequests();

   const snap = await db.ref("users/" + user.uid).once("value");
const profile = snap.val();

if (profile) {
    currentUserName =
        ((profile.name || "") + " " + (profile.surname || "")).trim();

    if (!currentUserName) {
        currentUserName = "Водій";
    }
} else {
    currentUserName = "Водій";
}
    const lastLat = Number(localStorage.getItem("lastLat"));
const lastLng = Number(localStorage.getItem("lastLng"));


if (showLocation && navigator.geolocation) {

    navigator.geolocation.getCurrentPosition(
        sendLocation,
        () => {},
        {
            enableHighAccuracy: true,
            maximumAge: 30000,
            timeout: 5000
        }
    );

    navigator.geolocation.watchPosition(
        sendLocation,
        () => alert("Не вдалося отримати геолокацію."),
        {
            enableHighAccuracy: true,
            maximumAge: 5000,
            timeout: 10000
        }
    );

}


});


document.getElementById("onlineBtn").onclick = () => {

    showLocation = !showLocation;

    localStorage.setItem("showLocation", showLocation);

    document.getElementById("onlineBtn").innerHTML =
        showLocation ? "🟢" : "🔴";

    db.ref("usersLocation/" + USER_ID).update({
        showLocation: showLocation
    });

};

document.getElementById("onlineBtn").innerHTML =
showLocation ? "🟢" : "🔴";

/* ---------- Лічильник користувачів ---------- */

const onlineControl = L.control({position:"topright"});

onlineControl.onAdd=function(){

this._div = L.DomUtil.create("div","online-counter");

this._div.style.background="white";
this._div.style.padding="8px 12px";
this._div.style.borderRadius="10px";
this._div.style.fontWeight="bold";
this._div.style.boxShadow="0 2px 8px rgba(0,0,0,.25)";
this._div.innerHTML="🚛 Онлайн: 0";

return this._div;

};

onlineControl.addTo(map);



function updateOnlineCounter(){

db.ref("usersLocation").once("value").then(snap=>{

let count=0;

snap.forEach(user=>{

const d=user.val();

if(d.online && d.showLocation){

if (Date.now() - d.lastUpdate < 5 * 60 * 1000) {

count++;

}

}

});

onlineControl._div.innerHTML="🚛 Онлайн: "+count;

});

}

setInterval(updateOnlineCounter,5000);

updateOnlineCounter();




/* ---------- Автоматичне центрування ---------- */

let firstLocate=true;


function sendLocation(position){

    const lat = position.coords.latitude;
    const lng = position.coords.longitude;

    localStorage.setItem("lastLat", lat);
    localStorage.setItem("lastLng", lng);

    if(firstLocate){
        map.setView([lat, lng], 12);
        firstLocate = false;
    }

    if(myMarker){
        myMarker.setLatLng([lat, lng]);
    }else{
        myMarker = L.circleMarker([lat, lng], {
            radius:8,
            color:"#fff",
            fillColor:"#2196f3",
            fillOpacity:1
        }).addTo(map);
    }


    // беремо профіль користувача
    db.ref("users/" + USER_ID).once("value").then(snap => {

        const profile = snap.val() || {};

        const userName = profile.name || 
                         localStorage.getItem("userName") || 
                         "Користувач";

        const userAvatar = profile.avatar || 
                           localStorage.getItem("userAvatar") || 
                           "";


        // записуємо позицію
        db.ref("usersLocation/" + USER_ID).set({

            uid: USER_ID,

            name: userName,

            avatar: userAvatar,

            lat: lat,

            lng: lng,

            online: true,

            showLocation: showLocation,

            lastUpdate: Date.now()

        });

    });

}

const friendsSheet = document.getElementById("friendsSheet");
const sheetHandle = document.getElementById("sheetHandle");

let startY = 0;
let moved = false;


// телефон
sheetHandle.addEventListener("touchstart", function(e){

    startY = e.touches[0].clientY;
    moved = false;

});


sheetHandle.addEventListener("touchmove", function(e){

    let y = e.touches[0].clientY;

    let diff = startY - y;


    if(Math.abs(diff)>20){
        moved=true;
    }


    if(diff > 0){

        friendsSheet.classList.add("open");

    }

    if(diff < -20){

        friendsSheet.classList.remove("open");

    }

});


// мишка
sheetHandle.addEventListener("mousedown",function(e){

    startY=e.clientY;
    moved=false;


});


document.addEventListener("mousemove",function(e){

    if(startY===0) return;


    let diff=startY-e.clientY;


    if(diff>20){

        friendsSheet.classList.add("open");

    }


    if(diff<-20){

        friendsSheet.classList.remove("open");

    }

});


document.addEventListener("mouseup",function(){

    startY=0;

});

document.addEventListener("touchend",function(){

startY=0;

});


const requestsBtn =
document.getElementById("requestsBtn");


const requestsModal =
document.getElementById("requestsModal");


const requestsList =
document.getElementById("requestsList");



// відкриття запитів

requestsBtn.addEventListener("touchend", function(e){

e.preventDefault();

requestsModal.style.display="block";

friendsSheet.classList.remove("open");

loadRequests();

});




// завантаження запитів

function loadRequests(){


db.ref("friendRequests/"+USER_ID)
.on("value",snap=>{


requestsList.innerHTML="";


if(!snap.exists()){

requestsList.innerHTML=
"Немає нових запитів";

return;

}



snap.forEach(item=>{


let req=item.val();

let uid=item.key;



let div=document.createElement("div");


div.className="requestItem";


div.innerHTML=`

<span>
👤 ${req.name}
</span>


<button class="acceptBtn">

✅ Прийняти

</button>

`;



div.querySelector("button")
.onclick=function(){

acceptFriend(uid,req.name);

};



requestsList.appendChild(div);



});


});


}



// прийняти друга

function acceptFriend(uid,name){


db.ref("friends/"+USER_ID+"/"+uid)
.set(true);


db.ref("friends/"+uid+"/"+USER_ID)
.set(true);



db.ref("friendRequests/"+USER_ID+"/"+uid)
.remove();


alert(
"✅ "+name+" доданий у друзі"
);


}

function listenFriendRequests(){

db.ref("friendRequests/"+USER_ID)
.on("value",snap=>{


let count = snap.numChildren();


document.getElementById("requestCount").innerHTML =
count ? count : "";


if(count > 0){

console.log("Нових запитів:", count);

}

});

}



db.ref("friends/"+USER_ID)
.on("value",snap=>{


friendsList.innerHTML="";


if(!snap.exists()){

friendsList.innerHTML=
"Немає друзів";

return;

}



snap.forEach(friend=>{


let uid=friend.key;



db.ref("usersLocation/"+uid)
.once("value")
.then(userSnap=>{


let user=userSnap.val();
const avatar =
    user.avatar || "avatars/avatar1.png";



if(!user){

return;

}



let div=document.createElement("div");


div.className="friendItem";


div.innerHTML=`

<div style="display:flex;align-items:center;gap:12px">

<img src="${avatar}"
style="
width:50px;
height:50px;
border-radius:50%;
object-fit:cover;
border:2px solid #0d6efd;
">

<div>

<b>${user.name}</b>

<br>

<span class="friendStatus">
${(Date.now() - (user.lastUpdate || 0) < 5 * 60 * 1000)
    ? "🟢 Онлайн"
    : "🕒 Був онлайн: " +
      new Date(user.lastUpdate).toLocaleTimeString("uk-UA", {
          hour: "2-digit",
          minute: "2-digit"
      })}
</span>

</div>

</div>


<button class="friendMapBtn">

📍

</button>

`;



div.querySelector("button")
.onclick=function(){


if(user.lat && user.lng){


map.setView(
[user.lat,user.lng],
15
);


if(userMarkers[uid]){

userMarkers[uid]
.openPopup();

}


}


};



friendsList.appendChild(div);



});


});



});


document.getElementById("closeFriends")
.onclick=function(){

friendsModal.style.display="none";

};const friendsBtn =
document.getElementById("friendsBtn");


const friendsModal =
document.getElementById("friendsModal");


const friendsList =
document.getElementById("friendsList");



friendsBtn.addEventListener("touchend", function(e){

e.preventDefault();

friendsModal.style.display="block";

friendsSheet.classList.remove("open");

loadFriends();

});





function loadFriends(){

db.ref("friends/"+USER_ID)
.on("value",snap=>{

friendsList.innerHTML="";


if(!snap.exists()){

friendsList.innerHTML="Немає друзів";

return;

}


snap.forEach(friend=>{

let uid = friend.key;


db.ref("usersLocation/"+uid)
.once("value")

let user = userSnap.val();


if(!user){

}

div.innerHTML=`

<div style="display:flex;align-items:center;gap:12px">

<img src="${avatar}"

height:50px;

">

<div>

<b>${user.name || "Водій"}</b>

<br>

<span class="friendStatus">
${(Date.now() - (user.lastUpdate || 0) < 5 * 60 * 1000)
    ? "🟢 Онлайн"

      new Date(user.lastUpdate).toLocaleTimeString("uk-UA", {
          hour: "2-digit",
          minute: "2-digit"
      })}
</span>

</div>

</div>


<div>

<button class="friendMapBtn">
📍
</button>

<button class="friendMapBtn" style="background:#dc3545">
❌
</button>

</div>

`;


// кнопка карта
div.querySelectorAll("button")[0].onclick=function(){

if(user.lat && user.lng){

map.setView(
[user.lat,user.lng],
15
);


if(userMarkers[uid]){
    userMarkers[uid].openPopup();
}

}

};
