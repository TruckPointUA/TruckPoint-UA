<!DOCTYPE html>
<html lang="uk">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Truck Maps</title>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@600;700;800&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">
<link href="https://fonts.googleapis.com/icon?family=Material+Icons" rel="stylesheet">
<script src="online.js"></script>

<style>
*{
    margin:0;
    padding:0;
    box-sizing:border-box;
    font-family:'Poppins',sans-serif;
}

body{
    background:linear-gradient(180deg,#4a72ce,#1e293b);
    color:white;
    min-height:100vh;
    padding-bottom:0;
}

.header{
    position:relative;
    text-align:center;
    padding:25px 15px;
}

.page-info-btn{
    position:absolute;
    right:18px;
    top:18px;
    width:42px;
    height:42px;
    border:none;
    border-radius:50%;
    background:rgba(255,255,255,.18);
    color:#fff;
    cursor:pointer;
    display:flex;
    align-items:center;
    justify-content:center;
    backdrop-filter:blur(8px);
    transition:.2s;
    box-shadow:0 4px 12px rgba(0,0,0,.25);
}

.page-info-btn:hover{
    background:rgba(255,255,255,.3);
    transform:scale(1.08);
}

.page-info-btn .material-icons{
    font-size:24px;
}

.logo{
    font-size:32px;
    margin-bottom:5px;
}

.title{
    font-size:18px;
    font-weight:600;
}

.subtitle{
    opacity:.8;
    font-size:14px;
}

.cards{ 
    padding:15px; 
    display:grid; 
    grid-template-columns:1fr 1fr; 
    gap:15px; 
} 
.card{ 
    aspect-ratio:1/1; 
    border-radius:22px; 
    box-shadow:0 4px 10px rgba(139, 143, 204, 0.25); 
    display:flex; 
    justify-content:center; 
    align-items:center; 
    text-decoration:none; 
    text-align:center; 
    color:white; 
}
.card-content{
    display:flex;
    flex-direction:column;
    align-items:center;
    justify-content:center;
    gap:10px;
    text-align:center;
}

.card-icon{
     width:55px; 
     height:55px; 
    } 
    .card-title{ 
        font-family:'Montserrat',sans-serif; 
        margin-top:10px; 
        font-size:17px; 
        font-weight:700; 
        line-height:1.3; 
        letter-spacing:0.4px; 
        text-align:center; color:#fff; 
        text-shadow:0 2px 8px rgba(0,0,0,.35); }
        
.card:active{
    transform:scale(.97);
}

.card .material-icons{
    font-size:36px;
}

.card h3{
    font-size:20px;
    margin-bottom:5px;
}

.card p{
    font-size:13px;
    opacity:.9;
}

.map1{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.map2{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.map3{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.map4{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.map5{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.map6{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.map7{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}
.map8{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}
.map9{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}
.map10{
    background:linear-gradient(135deg,#2563eb,#60a5fa);
}

.card{
    position:relative;
    overflow:hidden;
}

.info-btn{
    position:absolute;
    top:8px;
    right:8px;
    width:26px;
    height:26px;
    border-radius:50%;
    border:none;
    background:rgba(255,255,255,.2);
    color:#fff;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
    backdrop-filter:blur(6px);
    transition:.2s;
    z-index:5;
}

.info-btn:hover{
    background:rgba(255,255,255,.35);
    transform:scale(1.08);
}

/* Вікно */

.modal{
    position:fixed;
    inset:0;
    background:rgba(0,0,0,.55);
    display:none;
    justify-content:center;
    align-items:center;
    z-index:999;
}

.modal-box{
    width:90%;
    max-width:360px;
    background:#fff;
    color:#1e293b;
    border-radius:20px;
    padding:22px;
    animation:show .25s;
}

.modal-box h2{
    margin-bottom:12px;
}

.modal-box p{
    line-height:1.5;
}

.close{
    margin-top:18px;
    width:100%;
    border:none;
    padding:12px;
    border-radius:12px;
    background:#2563eb;
    color:#fff;
    cursor:pointer;
}

@keyframes show{
from{
transform:scale(.8);
opacity:0;
}
to{
transform:scale(1);
opacity:1;
}
}


</style>
</head>
<body>

<div class="header">

    <button class="page-info-btn" onclick="showPageInfo()">
        <span class="material-icons">info</span>
    </button>

    <div class="title">Точки Зацікавленості</div>

</div>

<div class="cards">

<a href="Магазини.html" class="card map1">

<button class="info-btn"
onclick="event.preventDefault();
event.stopPropagation();
showInfo('Продуктові магазини',
'Показує продуктові магазини, де можна придбати їжу, напої та товари першої необхідності.🚚 ДОСТУПНО ДЛЯ ВАНТАЖІВОК.')">
ⓘ
</button>

<div class="card-content">
<img src="maarket_map.svg" class="card-icon">
<div class="card-title">Продуктові магазини</div>
</div>

</a>

   <a href="Promky.html" class="card map2">
    <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Місця в пром-зонах',
'Стоянки та місця для очікування біля підприємств і заводів.')">
ⓘ
</button>
    <div class="card-content">
        <img src="promzona_map.svg" alt="Місця в Пром-Зонах" class="card-icon">
        <div class="card-title">Місця в Пром-Зонах</div>
    </div>
</a>

      <a href="Платні стоянки.html" class="card map3">
        <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Платні парковки',
'Парковки з оплатою, які часто мають охорону, туалет, душ або кафе.')">
ⓘ
</button>
     <div class="card-content">
        <img src="platnii_map.svg" alt="Платні парковки" class="card-icon"style="width:50px;height:50px;">
        <div class="card-title">Платні парковки</div>
    </div>
    </a>

    <a href="Безплатні стоянки.html" class="card map4">
        <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Безкоштовні парковки',
'Місця для безкоштовної стоянки вантажного транспорту.')">
ⓘ
</button>
             <div class="card-content">
        <img src="parkinglogoo_map.svg" alt="Безкоштовні парковки" class="card-icon">
        <div class="card-title">Безкоштовні парковки</div>
    </div>
    </a>

    <a href="Душ.html" class="card map5">
        <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Душ',
'Місця, де водій може скористатися душем.')">
ⓘ
</button>
      <div class="card-content">
        <img src="dush_map.svg" alt="Душ" class="card-icon">
        <div class="card-title"> Душ</div>
    </div>
    </a>

    <a href="При дорозі.html" class="card map6">
        <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('При дорозі',
'Кишені та місця для короткої зупинки біля дороги.')">
ⓘ
</button>
     <div class="card-content">
        <img src="pocket_map.svg" alt="Місця при дорозі" class="card-icon">
        <div class="card-title">При дорозі</div>
    </div>
    </a>

        <a href="map.html" class="card map7">
            <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Мийки цистерн',
'Пункти миття автоцистерн із зазначенням інформації та відгуків.')">
ⓘ
</button>
     <div class="card-content">
        <img src="moika_map.png" alt="Мийки цистерн" class="card-icon"style="width:45px;height:45px;">
        <div class="card-title">Мийки цистерн</div>
    </div>
    </a>
      <a href="Набрати воду.html" class="card map8">
        <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Набрати воду',
'Точки, де можна набрати чисту воду.')">
ⓘ
</button>
     <div class="card-content">
        <img src="water_map.svg" alt="Набрати воду" class="card-icon">
        <div class="card-title">Набрати воду</div>
    </div>
    </a>

         <a href="Шиномонтаж.html" class="card map9">
            <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Шиномонтаж',
'Сервіси для ремонту та заміни шин вантажних автомобілів.')">
ⓘ
</button>
     <div class="card-content">
        <img src="sinomontag_map.svg" alt="Шиномонтаж" class="card-icon">
        <div class="card-title">Шиномонтаж</div>
    </div>
    </a>

         <a href="?.html" class="card map10">
            <button class="info-btn"
onclick="event.preventDefault();event.stopPropagation();
showInfo('Неприємність',
'Місця, де користувачі повідомили про проблеми,крадіжку, небезпеку або інші труднощі.')">
ⓘ
</button>
     <div class="card-content">
        <img src="beda_map.svg" alt="Набрати воду" class="card-icon">
        <div class="card-title">Неприємність</div>
    </div>
    </a>

</div>

<div class="modal" id="infoModal">
    <div class="modal-box">
        <h2 id="infoTitle"></h2>
        <p id="infoText"></p>
        <button class="close" onclick="closeInfo()">Закрити</button>
    </div>
</div>

<script>
function showInfo(title,text){
    document.getElementById("infoTitle").textContent=title;
    document.getElementById("infoText").textContent=text;
    document.getElementById("infoModal").style.display="flex";
}

function closeInfo(){
    document.getElementById("infoModal").style.display="none";
}

document.getElementById("infoModal").addEventListener("click",function(e){
    if(e.target===this) closeInfo();
});

function showPageInfo(){

    showInfo(
        "Truck Point UA",

        "Truck Point UA — це спільна карта для водіїв вантажного транспорту.\n\n" +

        "📍 Ви можете додавати нові точки в будь-якій категорії: магазини, парковки, душ, шиномонтаж, місця для набору води та інші.\n\n" +

        "⭐ Також ви можете залишати відгуки, оцінювати точки та допомагати іншим водіям знаходити перевірені місця.\n\n" +

        "🔎 Додана вами точка спочатку проходить обробку та перевірку інформації розробником. Після підтвердження вона стає повноцінною точкою на карті та доступною для інших користувачів.\n\n" +

        "🤝 Чим більше учасників додають інформацію, тим кориснішою стає карта для всіх."
    );

}
</script>

</body>
</html>
