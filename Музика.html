<!DOCTYPE html>
<html lang="uk">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">

<title>Музика</title>

<link href="https://fonts.googleapis.com/css2?family=Roboto:wght@300;400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.2/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Roboto,sans-serif;
}

body{

background:#07152d;

color:white;

overflow-x:hidden;

}

/* HEADER */

header{

position:sticky;

top:0;

z-index:999;

background:linear-gradient(90deg,#0a84ff,#0057d9);

padding:18px;

box-shadow:0 4px 15px rgba(0,0,0,.35);

}

header h1{

font-size:28px;

text-align:center;

}

header p{

margin-top:6px;

text-align:center;

opacity:.8;

}

/* SEARCH */

.search{

padding:15px;

}

.search input{

width:100%;

padding:14px;

border:none;

border-radius:15px;

font-size:16px;

outline:none;

}

/* GENRES */
.genreBar{

display:flex;
flex-wrap:nowrap;

gap:12px;

overflow-x:auto;
overflow-y:hidden;

padding:15px;

-webkit-overflow-scrolling:touch;

scrollbar-width:none;

cursor:grab;

}

.genreBar::-webkit-scrollbar{
display:none;
}

.genreBtn{

flex:0 0 auto;

padding:12px 24px;

border:none;

border-radius:30px;

background:linear-gradient(90deg,#0a84ff,#0057d9);

color:white;

font-size:15px;

font-weight:bold;

white-space:nowrap;

cursor:pointer;

}

/* SONG LIST */

.songList{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:10px;

    height:calc(100vh - 180px);
    overflow-y:auto;
    padding-bottom:140px;

    scrollbar-width:none;      /* Firefox */
    -ms-overflow-style:none;   /* IE */
}

.songList::-webkit-scrollbar{
    display:none;              /* Chrome, Edge, Safari */
}
.songItem{
    display:flex;
    align-items:center;
    gap:10px;
    background:#10274b;
    padding:10px 12px;
    border-radius:12px;
}

.songItem:hover{

background:#16396a;

}

.songIcon{

font-size:28px;

color:#0a84ff;

}

.songTitle{
    font-size:15px;
}

.songArtist{
    font-size:12px;
}

/* PLAYER */

.player{
    position:fixed;
    left:0;
    bottom:0;
    width:100%;
    background:#081018;
    padding:10px 12px;
    border-radius:18px 18px 0 0;
    box-shadow:0 -5px 20px rgba(0,0,0,.5);
}


.songName{
    margin-top:2px;
    font-size:15px;
    text-align:center;
    font-weight:bold;
}

.artistName{
    margin-top:2px;
    font-size:12px;
    text-align:center;
    opacity:.8;
}

#progress{
    width:100%;
    height:6px;
    border-radius:10px;
    background:#1f3b63;
    outline:none;
    -webkit-appearance:none;
    appearance:none;
}

#progress::-webkit-slider-thumb{
    -webkit-appearance:none;
    width:16px;
    height:16px;
    border-radius:50%;
    background:#0a84ff;
    cursor:pointer;
}

#progress::-moz-range-thumb{
    width:16px;
    height:16px;
    border-radius:50%;
    background:#0a84ff;
    border:none;
    cursor:pointer;
}

.time{
    display:flex;
    justify-content:space-between;
    margin-top:4px;
    font-size:12px;
    opacity:.8;
}

.controls{
    display:flex;
    justify-content:center;
    align-items:center;
    gap:12px;
    margin-top:8px;
}

.controls button{
    width:46px;
    height:46px;
    border:none;
    border-radius:50%;
    background:linear-gradient(135deg,#00b4ff,#0066ff);
    color:#fff;
    font-size:18px;
    cursor:pointer;
}

.controls button:hover{
    background:linear-gradient(135deg,#22c1ff,#0a84ff);
    transform:translateY(-2px);
}

.controls button:active{
    transform:scale(.92);
}


/* MOBILE */

@media(max-width:600px){

.cover{

width:100px;

height:100px;

}

.songName{

font-size:16px;

}

.controls button{

width:60px;

height:60px;

}

}
.songList{
    padding:15px;
    display:flex;
    flex-direction:column;
    gap:12px;

    height:calc(100vh - 250px);
    overflow-y:auto;

    padding-bottom:180px;
}

.toast{
    position:fixed;
    left:50%;
    bottom:110px;
    transform:translateX(-50%) translateY(30px);
    background:linear-gradient(90deg,#a9b7c5,#575e69);
    color:#fff;
    padding:14px 22px;
    border-radius:30px;
    display:flex;
    align-items:center;
    gap:10px;
    font-size:15px;
    font-weight:500;
    box-shadow:0 8px 25px rgba(0,0,0,.35);
    opacity:0;
    visibility:hidden;
    transition:.35s;
    z-index:9999;
}

.toast.show{
    opacity:1;
    visibility:visible;
    transform:translateX(-50%) translateY(0);
}

.toast i{
    color:#7CFF8A;
    font-size:20px;
}

</style>

</head>

<body>
    <header>

<h1>Музика</h1>


</header>


<div class="genreBar">

<button class="genreBtn" onclick="changeFolder('New')">
New
</button>

<button class="genreBtn" onclick="changeFolder('ukrainian')">
Українська
</button>

<button class="genreBtn" onclick="changeFolder('2000-x')">
2000-х
</button>

<button class="genreBtn" onclick="changeFolder('Різне')">
Різне
</button>

<button class="genreBtn" onclick="showMyPlaylist()">
Мій плейлист
</button>


</div>


</div>

</div>



<!-- СПИСОК ПІСЕНЬ -->

<div id="songList" class="songList">

<div style="text-align:center;padding:40px;opacity:.7">

Завантаження музики...

</div>

</div>

<!-- ПЛЕЄР -->

<div class="player">


<div id="songName" class="songName">

Truck Music

</div>

<div id="artistName" class="artistName">

Виконавець

</div>

<audio id="audio"></audio>

<input
id="progress"
type="range"
value="0"
min="0"
max="100">

<div class="time">

<span id="currentTime">

0:00

</span>

<span id="duration">

0:00

</span>

</div>

<div class="controls">

<button onclick="prevSong()">

⏮

</button>

<button id="playBtn" onclick="playPause()">

▶

</button>

<button onclick="nextSong()">

⏭

</button>

</div>

</div>

<div id="toast" class="toast">
    <i class="fa-solid fa-circle-check"></i>
    <span>Додано до вашого плей-листа</span>
</div>

<script>

const OWNER = "Myjkicystern";
const REPO = "muzik-truck";

let folder = "New";

let playlist = [];
let current = 0;

let myPlaylist = JSON.parse(localStorage.getItem("myPlaylist")) || [];

const audio = document.getElementById("audio");
const playBtn = document.getElementById("playBtn");

function removeFromPlaylist(index){

    myPlaylist.splice(index, 1);

    localStorage.setItem("myPlaylist", JSON.stringify(myPlaylist));

    showMyPlaylist();

}

async function loadPlaylist(){

    document.getElementById("songList").innerHTML =
        "<div style='padding:25px;text-align:center'>Завантаження...</div>";

    const url =
`https://api.github.com/repos/${OWNER}/${REPO}/contents/${folder}`;

    try{

        const response = await fetch(url);

        if(!response.ok){
            throw new Error("Папку не знайдено");
        }

        const files = await response.json();

        playlist = files
        .filter(file=>file.name.toLowerCase().endsWith(".mp3"))
        .sort((a,b)=>a.name.localeCompare(b.name))
        .map(file=>({

            title:file.name.replace(".mp3",""),

            artist:folder,

            url:file.download_url

        }));

        showSongs();

        if(playlist.length){

            loadSong(0);

        }

    }catch(err){

        document.getElementById("songList").innerHTML=
        "<div style='padding:25px;text-align:center'>Немає музики</div>";

        console.log(err);

    }

}

function showSongs(isMyPlaylist = false){

    let html = "";

    playlist.forEach((song,index)=>{

        html += `
        <div class="songItem" onclick="loadSong(${index});playMusic()">

            <i class="fa-solid fa-music songIcon"></i>

            <div style="flex:1">
                <div class="songTitle">${song.title}</div>
                <div class="songArtist">${song.artist}</div>
            </div>

            ${
                isMyPlaylist
                ? `<button onclick="event.stopPropagation();removeFromPlaylist(${index})"
                    style="background:none;border:none;color:red;font-size:22px;cursor:pointer;">🗑</button>`
                : `<button onclick="event.stopPropagation();addToPlaylist(playlist[${index}])"
style="background:#0a84ff;border:none;color:white;width:34px;height:34px;border-radius:50%;font-size:22px;font-weight:bold;cursor:pointer;">
+
</button>`
            }

        </div>`;
    });

    document.getElementById("songList").innerHTML = html;

}

function loadSong(index){

    current=index;

    audio.src=playlist[index].url;

    document.getElementById("songName").innerHTML=
    playlist[index].title;

    document.getElementById("artistName").innerHTML=
    playlist[index].artist;

    audio.load();

}

function playMusic(){

    audio.play();

    playBtn.innerHTML="⏸";

}

function playPause(){

    if(audio.paused){

        playMusic();

    }else{

        audio.pause();

        playBtn.innerHTML="▶";

    }

}

function nextSong(){

    current++;

    if(current>=playlist.length)
        current=0;

    loadSong(current);

    playMusic();

}

function prevSong(){

    current--;

    if(current<0)
        current=playlist.length-1;

    loadSong(current);

    playMusic();

}

audio.onended=nextSong;

audio.addEventListener("timeupdate",()=>{

    progress.max=audio.duration||0;

    progress.value=audio.currentTime;

    currentTime.innerHTML=format(audio.currentTime);

    duration.innerHTML=format(audio.duration);

});

progress.oninput=function(){

    audio.currentTime=this.value;

}

function format(sec){

    if(isNaN(sec)) return "0:00";

    sec=Math.floor(sec);

    let m=Math.floor(sec/60);

    let s=sec%60;

    if(s<10)s="0"+s;

    return m+":"+s;

}

function changeFolder(name){

    folder=name;

    loadPlaylist();

}

function showMyPlaylist(){

    myPlaylist = JSON.parse(localStorage.getItem("myPlaylist")) || [];

    playlist = [...myPlaylist];

    showSongs(true);

    if(playlist.length){
        loadSong(0);
    }

}

const slider = document.querySelector(".genreBar");

let isDown = false;
let startX;
let scrollLeft;

slider.addEventListener("mousedown", e => {
    isDown = true;
    slider.style.cursor = "grabbing";
    startX = e.pageX - slider.offsetLeft;
    scrollLeft = slider.scrollLeft;
});

slider.addEventListener("mouseleave", () => {
    isDown = false;
    slider.style.cursor = "grab";
});

slider.addEventListener("mouseup", () => {
    isDown = false;
    slider.style.cursor = "grab";
});

slider.addEventListener("mousemove", e => {
    if (!isDown) return;
    e.preventDefault();
    const x = e.pageX - slider.offsetLeft;
    const walk = (x - startX) * 2;
    slider.scrollLeft = scrollLeft - walk;
});


function addToPlaylist(song){

    console.log(song);

    myPlaylist = JSON.parse(localStorage.getItem("myPlaylist")) || [];

    if(myPlaylist.some(s => s.url === song.url)){
        showToast("⚠️ Трек уже є у плей-листі");
        return;
    }

    myPlaylist.push(song);

    localStorage.setItem("myPlaylist", JSON.stringify(myPlaylist));

    console.log(localStorage.getItem("myPlaylist"));

    showToast("✅ Додано до вашого плей-листа");

}

function showToast(text){

    const toast = document.getElementById("toast");

    toast.querySelector("span").textContent = text;

    toast.classList.add("show");

    clearTimeout(toast.timer);

    toast.timer = setTimeout(()=>{
        toast.classList.remove("show");
    },3000);

}

loadPlaylist();

</script>
</body>
