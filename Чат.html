<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Чат</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}



body{

height:100dvh;

display:flex;

flex-direction:column;

background:#edf2f7;

overflow:hidden;
height:100%;
min-height:100dvh;

display:flex;
flex-direction:column;

overflow:hidden;

}



/* ШАПКА */

.header{

height:60px;

background:#1677ff;

color:white;

display:flex;

align-items:center;

padding:0 12px;

gap:12px;

box-shadow:0 2px 10px #0003;

}



.back{

width:42px;
height:42px;

border-radius:50%;

background:rgba(255,255,255,.18);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

font-size:28px;

transition:.25s;

backdrop-filter:blur(5px);

}


.back:hover{

background:rgba(255,255,255,.35);

transform:scale(1.08);

}


.back span{

margin-top:-3px;

font-weight:bold;

}



.avatar{

width:42px;

height:42px;

border-radius:50%;

overflow:hidden;

background:#ddd;

}



.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



.userBox{

display:flex;

flex-direction:column;

}



.userName{

font-size:17px;

font-weight:bold;

}



.status{

font-size:12px;

opacity:.8;

}




/* ПОВІДОМЛЕННЯ */


.messages{

flex:1;

overflow-y:auto;

padding:15px;

padding-bottom:100px;

display:flex;

flex-direction:column;

gap:8px;

}


.msg{

max-width:78%;

padding:10px 14px;

border-radius:15px;

position:relative;

word-break:break-word;

font-size:15px;

}



.me{

align-self:flex-end;

background:#1677ff;

color:white;

border-bottom-right-radius:4px;

}



.other{

align-self:flex-start;

background:white;

color:#222;

border-bottom-left-radius:4px;

}




.msgTime{

font-size:11px;

opacity:.7;

margin-top:5px;

text-align:right;

}



.actions{

display:none;

position:absolute;

right:5px;

bottom:-45px;

background:white;

border-radius:10px;

box-shadow:0 5px 15px #0005;

overflow:hidden;

z-index:99999;

padding:5px;

gap:5px;

}


.actions button{

border:0;

background:white;

padding:8px 12px;

font-size:18px;

cursor:pointer;

border-radius:8px;

}


.actions button:hover{

background:#eee;

}


.msg.showActions .actions{

display:flex;

}


.msg:hover .actions{

display:block;

}




/* ВВІД */


.bottom{

height:65px;
min-height:65px;

background:white;

border-top:1px solid #ddd;

display:flex;
align-items:center;

gap:10px;

padding:10px;

position:fixed;

bottom:0;

left:0;

right:0;

z-index:9999;

padding-bottom:calc(10px + env(safe-area-inset-bottom));

}

#text{

flex:1;

height:45px;

border:0;

background:#f1f3f7;

border-radius:25px;

padding:0 18px;

font-size:15px;

outline:none;

}



#send{

width:45px;

height:45px;

border-radius:50%;

border:0;

background:#1677ff;

color:white;

font-size:20px;

cursor:pointer;

}


.messageText{

white-space:pre-wrap;

}


.msg:hover .actions{

display:flex;

}


.actions{

gap:5px;

}



.actions button{

border-radius:5px;

}

.replyBox{

background:#dbeafe;

padding:8px 12px;

border-left:4px solid #1677ff;

border-radius:8px;

margin-bottom:8px;

font-size:13px;

color:#333;

}


.replyPreview{

display:none;

background:white;

padding:8px;

border-top:1px solid #ddd;

font-size:13px;

}


.replyPreview span{

font-weight:bold;

color:#1677ff;

}


.pin{

font-size:12px;

color:#ffd700;

}
.pinBox{

background:white;

padding:10px;

border-bottom:1px solid #ddd;

font-size:14px;

display:none;

}


.pinBox span{

color:#1677ff;

font-weight:bold;

}



.searchChat{

display:none;

padding:8px;

background:white;

}



.searchChat input{

width:100%;

padding:10px;

border-radius:20px;

border:0;

background:#f1f3f7;

outline:none;

}
body.dark{

background:#111827;

}


body.dark .messages{

background:#0f172a;

}


body.dark .other{

background:#1e293b;

color:white;

}


body.dark .bottom{

background:#111827;

border-color:#333;

}


body.dark #text{

background:#1e293b;

color:white;

}


body.dark .replyPreview{

background:#1e293b;

color:white;

}

</style>


</head>



<body>

<div id="notify"
style="
display:none;
position:fixed;
top:70px;
left:50%;
transform:translateX(-50%);
background:#1677ff;
color:white;
padding:12px 20px;
border-radius:25px;
z-index:2000;
box-shadow:0 5px 15px #0004;
font-size:15px;
">
</div>

<div class="header">

    <div onclick="deleteChat()"
style="font-size:22px;cursor:pointer">

🗑

</div>

<div onclick="toggleDark()"
style="font-size:22px;cursor:pointer">
🌙
</div>


<div onclick="openSearch()"
style="font-size:22px;cursor:pointer">
🔎
</div>

    <div id="pinBox" class="pinBox">

📌 Закріплено:
<span id="pinText"></span>

</div>


<div id="searchChat" class="searchChat">

<input id="searchMessage"
placeholder="Пошук повідомлень...">

</div>


<div class="back" onclick="goBack()">
    <span>←</span>
</div>

<div onclick="openChatMenu()"
style="margin-left:auto;font-size:25px;cursor:pointer">

⋮

</div>



<div class="avatar">

<img id="chatAvatar"
src="avatars/avatar1.png">

</div>



<div class="userBox">

<div class="userName"
id="chatName">

Користувач

</div>


<div class="status"
id="status">

онлайн

</div>


</div>



</div>




<div class="messages"
id="messages">

</div>
<div class="bottom">


<input id="text"
placeholder="Повідомлення...">



<button id="send">

➤

</button>


</div>

<div id="chatMenu"

style="
display:none;
position:fixed;
right:10px;
top:60px;
background:white;
border-radius:10px;
box-shadow:0 5px 20px #0004;
z-index:999;
overflow:hidden;
">


<div onclick="blockUser()"
style="
padding:15px;
cursor:pointer;
">

🚫 Заблокувати

</div>


<div onclick="unblockUser()"
style="
padding:15px;
cursor:pointer;
">

✅ Розблокувати

</div>


</div>



<div id="replyPreview" class="replyPreview">

Відповідь на:
<span id="replyText"></span>

<button onclick="cancelReply()">
✖
</button>

</div>


<audio id="msgSound">

<source src="message.mp3" type="audio/mpeg">

</audio>


<script>

const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL:
"https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId:"truckpoint-ua",

storageBucket:"truckpoint-ua.firebasestorage.app",

messagingSenderId:"992372126132",

appId:"1:992372126132:web:3378b6b1794066132d42e1"

};



firebase.initializeApp(firebaseConfig);



const auth=firebase.auth();

const db=firebase.database();



let USER_ID="";

let CHAT_ID=localStorage.getItem("chatId");

let CHAT_USER=localStorage.getItem("chatUser");

let replyMessage=null;



const messages=
document.getElementById("messages");


const text=
document.getElementById("text");


const send=
document.getElementById("send");

let typingTimer;


// =====================
// TYPING
// =====================


text.addEventListener("input",()=>{


if(!USER_ID || !CHAT_USER)
return;



db.ref(
"typing/"+CHAT_ID+"/"+USER_ID
)

.set(true);



clearTimeout(typingTimer);



typingTimer=setTimeout(()=>{


db.ref(
"typing/"+CHAT_ID+"/"+USER_ID
)

.set(false);



},1500);



});

// =====================
// ПОКАЗ ДРУКУЄ...
// =====================


function watchTyping(){


if(!CHAT_USER)return;



db.ref(
"typing/"+CHAT_ID+"/"+CHAT_USER
)

.on("value",snap=>{


let status =
document.getElementById("status");



if(snap.val()){


status.textContent="✍️ друкує...";


}else{


watchUserStatus();


}



});


}



watchTyping();



// =====================
// АВТОРИЗАЦІЯ
// =====================


auth.onAuthStateChanged(user=>{


if(user){


USER_ID=user.uid;


loadUser();


loadMessages();


setOnline();


}else{


auth.signInAnonymously();


}


});




// =====================
// ДАНІ СПІВРОЗМОВНИКА
// =====================


function loadUser(){


if(!CHAT_USER)return;


db.ref("users/"+CHAT_USER)
.once("value")
.then(snap=>{

let user=snap.val();

chatName.textContent =
user.name+" "+user.surname;


chatAvatar.src =
user.avatar;

});

}



// =====================
// ЗАВАНТАЖЕННЯ ПОВІДОМЛЕНЬ
// =====================


function loadMessages(){


if(!CHAT_ID)return;



messages.innerHTML="";

unreadTitle=0;

updateTitle();



db.ref("privateMessages/"+CHAT_ID)

.off();



db.ref("privateMessages/"+CHAT_ID)

.orderByChild("time")

.on("child_added",snap=>{


let msg=snap.val();



if(msg.uid!==USER_ID){

unreadTitle++;

updateTitle();

showNotify(
"Нове повідомлення"
);



let sound=document.getElementById(
"msgSound"
);


if(sound){

sound.play();

}



}



addMessage(
snap.key,
msg
);



});



}



// =====================
// ВИВІД ПОВІДОМЛЕННЯ
// =====================


function addMessage(id,msg){


let div=document.createElement("div");
div.id = "msg-" + id;


div.className =
"msg " +
(msg.uid===USER_ID ? "me":"other");



let d=new Date(
msg.time || Date.now()
);



let time =
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");



let read = "";

if(msg.uid===USER_ID){

read =
msg.read ? " ✓✓" : " ✓";

}



div.innerHTML = `


${msg.reply ? `

<div class="replyBox">

↩ ${msg.reply}

</div>

`:''}



<div class="messageText">

${msg.text}

</div>


<div class="msgTime">

${time}${read}

</div>



${msg.uid===USER_ID ? `

<div class="actions">

    <button onclick="pinMessage('${id}','${msg.text.replace(/'/g,"\\'")}')">

📌

</button>


<button onclick="replyToMessage('${msg.text.replace(/'/g,"\\'")}')">

↩

</button>



${msg.uid===USER_ID ? `

<button onclick="editMessage('${id}','${msg.text.replace(/'/g,"\\'")}')">

✏️

</button>


<button onclick="deleteMessage('${id}')">

🗑

</button>

`:''}

</div>

`:''}


`;



messages.appendChild(div);

div.onclick=function(e){

// якщо натиснули на кнопку - не закривати
if(e.target.tagName==="BUTTON")
return;


// закрити інші меню
document.querySelectorAll(".msg")
.forEach(m=>{
m.classList.remove("showActions");
});


// відкрити своє
div.classList.toggle("showActions");


};



messages.scrollTop =
messages.scrollHeight;



// позначаємо чуже повідомлення прочитаним

if(msg.uid!==USER_ID && !msg.read){


if(msg.uid!==USER_ID && !msg.read){


db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.update({

read:true

});



db.ref(
"chats/"+CHAT_ID+"/unread/"+USER_ID
)

.set(0);



}


}


}



// =====================
// РЕДАГУВАННЯ
// =====================


function editMessage(id,oldText){


let newText =
prompt(
"Редагувати повідомлення:",
oldText
);



if(!newText)return;


newText=newText.trim();


if(!newText)return;



db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.update({

text:newText,

edited:true

});


}




// =====================
// ВИДАЛЕННЯ
// =====================


function deleteMessage(id){


if(!confirm(
"Видалити повідомлення?"
))

return;



db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.remove()

.then(()=>{


let msgElement =
document.getElementById(
"msg-"+id
);



if(msgElement){

msgElement.remove();

}



});


}



// =====================
// НАДІСЛАТИ
// =====================


function sendMessage(){

let value=text.value.trim();

if(!value)return;


db.ref("blocked/"+USER_ID+"/"+CHAT_USER)
.once("value")
.then(block=>{


if(block.exists()){

alert("Ви заблокували цього користувача");

return;

}


db.ref("privateMessages/"+CHAT_ID)
.push({

uid:USER_ID,

text:value,

reply:replyMessage || null,

time:
firebase.database.ServerValue.TIMESTAMP

});


text.value="";

});


}

send.onclick = sendMessage;


text.addEventListener("keydown",e=>{

if(e.key==="Enter"){

e.preventDefault();

sendMessage();

}

});

function goBack(){


location.href="Повідомлення.html";


}




// =====================
// ONLINE
// =====================


function setOnline(){

db.ref("online/"+USER_ID).set({

online:true,

lastSeen:Date.now()

});


db.ref("online/"+USER_ID)
.onDisconnect()
.set({

online:false,

lastSeen:Date.now()

});

}
// =====================
// СТАТУС СПІВРОЗМОВНИКА
// =====================


function watchUserStatus(){


if(!CHAT_USER)return;


db.ref("online/"+CHAT_USER)

.on("value",snap=>{


let status=document.getElementById("status");


if(snap.val()){


status.textContent="🟢 онлайн";


}else{


status.textContent="⚪ офлайн";


}



});


}




// запуск

setTimeout(()=>{

watchUserStatus();

},1000);
// =====================
// REPLY
// =====================


function replyToMessage(text){


replyMessage=text;



document.getElementById(
"replyPreview"
)

.style.display="block";



document.getElementById(
"replyText"
)

.textContent=text;


}




function cancelReply(){


replyMessage=null;


document.getElementById(
"replyPreview"
)

.style.display="none";


}
// =====================
// PIN MESSAGE
// =====================


function pinMessage(id,text){


db.ref(
"chats/"+CHAT_ID+"/pinned"
)

.set({

id:id,

text:text

});


}
function loadPinned(){


db.ref(
"chats/"+CHAT_ID+"/pinned"
)

.on("value",snap=>{


let p=snap.val();


let box=document.getElementById(
"pinBox"
);



if(p){


box.style.display="block";


document.getElementById(
"pinText"
)

.textContent=p.text;



}else{


box.style.display="none";


}



});


}


loadPinned();
function openSearch(){


let box=document.getElementById(
"searchChat"
);



if(box.style.display==="block"){


box.style.display="none";


}else{


box.style.display="block";


}



}



document.getElementById(
"searchMessage"
)

.addEventListener(
"input",
function(){


let value=this.value.toLowerCase();



document.querySelectorAll(
".msg"
)

.forEach(m=>{


if(
m.innerText
.toLowerCase()
.includes(value)
){


m.style.display="block";


}else{


m.style.display="none";


}



});



});

// =====================
// DARK MODE
// =====================


function toggleDark(){


document.body.classList.toggle("dark");


localStorage.setItem(

"dark",

document.body.classList.contains("dark")

);


}




if(localStorage.getItem("dark")=="true"){

document.body.classList.add("dark");

}

// =====================
// DELETE CHAT
// =====================


function deleteChat(){


if(!confirm(
"Видалити цей чат?"
))

return;



db.ref(
"privateMessages/"+CHAT_ID
)

.remove();



db.ref(
"chats/"+CHAT_ID
)

.remove();



location.href=
"Повідомлення.html";


}

function openChatMenu(){

let menu=document.getElementById("chatMenu");

menu.style.display =
menu.style.display==="block"
?
"none"
:
"block";

}
{


let menu=document.getElementById(
"chatMenu"
);


menu.style.display=

menu.style.display==="block"

?

"none"

:

"block";


}
function unblockUser(){


db.ref(
"blocked/"+USER_ID+"/"+CHAT_USER
)

.remove();



alert(
"Користувача розблоковано"
);



}

function showNotify(text){


let box=document.getElementById(
"notify"
);


box.textContent=text;


box.style.display="block";



setTimeout(()=>{


box.style.display="none";


},3000);


}

let unreadTitle=0;



function updateTitle(){


if(unreadTitle>0){


document.title=
"("+unreadTitle+") Нове повідомлення";


}else{


document.title="Чат";


}


}
function blockUser(){

db.ref(
"blocked/"+USER_ID+"/"+CHAT_USER
)
.set(true);

alert("Користувача заблоковано");

}
</script>



</body>

</html>
