<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Чат</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}



body{

height:100dvh;

display:flex;

flex-direction:column;

background:#edf2f7;

overflow:hidden;
height:100%;
min-height:100dvh;

display:flex;
flex-direction:column;

overflow:hidden;

}



/* ШАПКА */

.header{
    height:60px;
    background:#1677ff;
    color:white;
    display:flex;
    align-items:center;
    padding:0 12px;
    box-shadow:0 2px 10px #0003;
}



.back{

width:42px;
height:42px;

border-radius:50%;

background:rgba(255,255,255,.18);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

font-size:28px;

transition:.25s;

backdrop-filter:blur(5px);

}


.back:hover{

background:rgba(255,255,255,.35);

transform:scale(1.08);

}


.back span{

margin-top:-3px;

font-weight:bold;

}



.avatar{

width:42px;

height:42px;

border-radius:50%;

overflow:hidden;

background:#ddd;

}



.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



.userBox{

display:flex;

flex-direction:column;

}



.userName{

font-size:17px;

font-weight:bold;

}



.status{

font-size:12px;

opacity:.8;

}

#status{
    font-size:13px;
    font-weight:500;
}

#status.online{
    color:#7CFC00; /* яскраво-зелений */
}

#status.offline{
    color:#ffffff;
    opacity:.8;
}


/* ПОВІДОМЛЕННЯ */


.messages{
    position:fixed;
    top:60px;
    left:0;
    right:0;
    bottom:60px;

    overflow-y:auto;
    overflow-x:hidden;

    padding:8px;
    padding-bottom:20px;

    display:flex;
    flex-direction:column;
    gap:3px;

    align-items:flex-start; /* ← ДОДАТИ */
}


.msg{
    position:relative;
    display:inline-block;
    width:fit-content;
    max-width:75%;
    padding:10px 14px;
    margin:4px 0 22px;
    border-radius:18px;
    word-break:break-word;
}
.msg.me{
    align-self:flex-end;
}

.msg.other{
    align-self:flex-start;
}

/* МОЇ ПОВІДОМЛЕННЯ */

.me{
    background:#1f7cff;
    color:#fff;
    border-radius:18px 18px 4px 18px;
}


/* ЧУЖІ ПОВІДОМЛЕННЯ */

.other{
    background:#fff;
    color:#222;
    border-radius:18px 18px 18px 4px;
}


/* ТЕКСТ */

.messageText{
    display:inline;

    white-space:pre-wrap;

    font-size:17px;

    line-height:1.35;

    font-weight:500;
}


/* ЧАС ПІД БУЛЬБАШКОЮ */

.msgTime{
    position:absolute;
    right:6px;
    bottom:-18px;
    font-size:11px;
    color:#777;
    white-space:nowrap;
}

.me .msgTime{

    color:#666;

}
.actions{
    display:none;

    position:absolute;

    top:50%;
    transform:translateY(-50%);

    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);

    padding:4px;
    gap:4px;

    z-index:1000;
}

.me .actions{
    left:-95px;
}

.other .msgTime{
    color:#777;
}
.other .actions{
    right:-95px;
}

.actions button{
    width:34px;
    height:34px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    background:white;

    border-radius:8px;

    font-size:17px;

    cursor:pointer;
}


.actions button:hover{

background:#eee;

}


.msg.showActions .actions{

display:flex;

}


.msg.showActions .actions{
    display:flex;
}



/* ВВІД */


.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:60px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:8px 10px;

    background:#fff;

    border-top:1px solid #ddd;

    z-index:9999;

    padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
#text{
    flex:1;
    width:100%;
    height:45px;

    border:0;
    background:#f1f3f7;

    border-radius:25px;

    padding:0 18px;

    font-size:15px;

    outline:none;
}



#send{

width:45px;

height:45px;

border-radius:50%;

border:0;

background:#1677ff;

color:white;

font-size:20px;

cursor:pointer;

}


.messageText{
    white-space: pre-wrap;
    font-size: 18px;      /* розмір тексту */
    line-height: 1.4;     /* висота рядка */
    font-weight: 500;
}
.actions{

gap:5px;

}



.actions button{

border-radius:5px;

}

.replyBox{

background:#dbeafe;

padding:5px 8px;

border-left:4px solid #1677ff;

border-radius:8px;

margin-bottom:8px;

font-size:13px;

color:#333;

}


.replyPreview{

display:none;

background:white;

padding:8px;

border-top:1px solid #ddd;

font-size:13px;

}


.replyPreview span{

font-weight:bold;

color:#1677ff;

}


.pin{

font-size:12px;

color:#ffd700;

}
.pinBox{

background:white;

padding:10px;

border-bottom:1px solid #ddd;

font-size:14px;

display:none;

}


.pinBox span{

color:#1677ff;

font-weight:bold;

}


body.dark{

background:#111827;

}


body.dark .messages{

background:#0f172a;

}


body.dark .other{

background:#1e293b;

color:white;

}


body.dark .bottom{

background:#111827;

border-color:#333;

}


body.dark #text{

background:#1e293b;

color:white;

}


body.dark .replyPreview{

background:#1e293b;

color:white;

}

.menuItem{
    display:flex;
    align-items:center;
    gap:12px;
    padding:13px 18px;
    font-size:15px;
    color:#333;
    cursor:pointer;
    transition:.18s;
    user-select:none;
}

.menuItem:hover{
    background:#f5f7fb;
}

.menuItem:active{
    background:#e9eef8;
    transform:scale(.98);
}

.menuItem i{
    width:22px;
    text-align:center;
    color:#1976d2;
    font-size:17px;
}

</style>


</head>



<body>

<div id="notify"
style="
display:none;
position:fixed;
top:70px;
left:50%;
transform:translateX(-50%);
background:#1677ff;
color:white;
padding:12px 20px;
border-radius:25px;
z-index:2000;
box-shadow:0 5px 15px #0004;
font-size:15px;
">
</div>

<div class="header">

   <div style="width:24px;"></div>

    <div style="flex:1;display:flex;justify-content:center;align-items:center;gap:10px;">

        <div class="avatar">
            <img id="chatAvatar" src="avatars/avatar1.png">
        </div>

        <div class="userBox">
            <div class="userName" id="chatName">Користувач</div>
            <div class="status" id="status">онлайн</div>
        </div>

    </div>

    <div onclick="openChatMenu()" style="font-size:25px;cursor:pointer">
        ⋮
    </div>

</div>



</div>




<div class="messages"
id="messages">

</div>
<div class="bottom">


<input id="text"
placeholder="Повідомлення...">



<button id="send">

➤

</button>


</div>

<div id="chatMenu"

style="
display:none;
position:fixed;
right:12px;
top:58px;
min-width:210px;
background:#ffffff;
border:1px solid #e8e8e8;
border-radius:18px;
box-shadow:0 12px 35px rgba(0,0,0,.18);
backdrop-filter:blur(12px);
-webkit-backdrop-filter:blur(12px);
overflow:hidden;
z-index:9999;
padding:6px 0;
animation:menuOpen .18s ease;
">

<div id="blockItem"
onclick="blockUser()"
style="display:none;padding:15px;cursor:pointer">
🚫 Заблокувати
</div>

<div
onclick="deleteChat()"
style="padding:15px;cursor:pointer;color:#d32f2f;border-top:1px solid #eee;">
🗑 Видалити чат
</div>

<div id="unblockItem"
onclick="unblockUser()"
style="display:none;padding:15px;cursor:pointer">
✅ Розблокувати
</div>

</div>




<audio id="msgSound">

<source src="message.mp3" type="audio/mpeg">

</audio>


<script>

const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL:
"https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId:"truckpoint-ua",

storageBucket:"truckpoint-ua.firebasestorage.app",

messagingSenderId:"992372126132",

appId:"1:992372126132:web:3378b6b1794066132d42e1"

};



firebase.initializeApp(firebaseConfig);
const sound = document.getElementById("msgSound");

document.addEventListener("click", () => {
    sound.volume = 0;
    sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
        sound.volume = 1;
    }).catch(() => {});
}, { once: true });


const auth=firebase.auth();

const db=firebase.database();



let USER_ID="";

let CHAT_ID=localStorage.getItem("chatId");


let CHAT_USER=localStorage.getItem("chatUser");

let replyMessage=null;

console.log("CHAT_ID:", CHAT_ID);
console.log("CHAT_USER:", CHAT_USER);

const messages=
document.getElementById("messages");


const text=
document.getElementById("text");


const send=
document.getElementById("send");

send.addEventListener("click", sendMessage);

text.addEventListener("keydown", function(e){
    if(e.key === "Enter"){
        e.preventDefault();
        sendMessage();
    }
});

let typingTimer;


// =====================
// TYPING
// =====================


text.addEventListener("input",()=>{


if(!USER_ID || !CHAT_USER)
return;



db.ref(
"typing/"+CHAT_ID+"/"+USER_ID
)

.set(true);



clearTimeout(typingTimer);



typingTimer=setTimeout(()=>{


db.ref(
"typing/"+CHAT_ID+"/"+USER_ID
)

.set(false);



},1500);



});

// =====================
// ПОКАЗ ДРУКУЄ...
// =====================


function watchTyping(){


if(!CHAT_USER)return;



db.ref(
"typing/"+CHAT_ID+"/"+CHAT_USER
)

.on("value",snap=>{


let status =
document.getElementById("status");



if(snap.val()){


status.textContent="✍️ друкує...";


}else{


watchUserStatus();


}



});


}



watchTyping();



// =====================
// АВТОРИЗАЦІЯ
// =====================


auth.onAuthStateChanged(user=>{


if(user){


USER_ID=user.uid;
CHAT_ID = localStorage.getItem("chatId");


loadUser();


loadMessages();


setOnline();


}else{


auth.signInAnonymously();


}


});




// =====================
// ДАНІ СПІВРОЗМОВНИКА
// =====================


function loadUser(){

    if(!CHAT_USER) return;

    db.ref("users/"+CHAT_USER).once("value").then(snap=>{

const user = snap.val();

if (!user) return;

chatName.textContent =
    (user.name || "") + " " + (user.surname || "");

console.log("avatar:", user.avatar);
console.log("photoURL:", user.photoURL);

chatAvatar.src =
    (typeof user.avatar === "string" && user.avatar.trim() !== "")
        ? user.avatar
        : (typeof user.photoURL === "string" && user.photoURL.trim() !== "")
            ? user.photoURL
            : "avatars/avatar1.png";

chatAvatar.onerror = function () {
    this.onerror = null;
    this.src = "avatars/avatar1.png";
};

    });

}


// =====================
// ЗАВАНТАЖЕННЯ ПОВІДОМЛЕНЬ
// =====================

let firstLoad = true;

function loadMessages(){

    if(!CHAT_ID) return;

    messages.innerHTML = "";

    unreadTitle = 0;
    updateTitle();

    firstLoad = true;

    const ref = db.ref("privateMessages/" + CHAT_ID);

    ref.off();

    // Спочатку завантажуємо всю історію
    ref.orderByChild("time").once("value", snap => {

        messages.innerHTML = "";

        snap.forEach(child => {
            addMessage(child.key, child.val());
        });

        // Після цього слухаємо тільки нові повідомлення
        firstLoad = false;

        ref.orderByChild("time").limitToLast(1).on("child_added", snap => {

            const msg = snap.val();

            // Якщо повідомлення вже є на екрані — пропускаємо
            if(document.getElementById("msg-" + snap.key)){
                return;
            }

            addMessage(snap.key, msg);

            if(msg.uid !== USER_ID){

                showNotification(
                    "Нове повідомлення",
                    msg.name + ": " + msg.text,
                    "💬"
                );

                if(document.hidden){
                    sound.currentTime = 0;
                    sound.play().catch(()=>{});
                }

            }

        });

    });

}


// =====================
// ВИВІД ПОВІДОМЛЕННЯ
// =====================


function addMessage(id,msg){


let div=document.createElement("div");
div.id = "msg-" + id;


div.className =
"msg " +
(msg.uid===USER_ID ? "me":"other");

if(msg.uid === USER_ID){
    div.style.alignSelf = "flex-end";
}else{
    div.style.alignSelf = "flex-start";
}



let d=new Date(
msg.time || Date.now()
);



let time =
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");



let read = "";

if(msg.uid===USER_ID){

read =
msg.read ? " ✓✓" : " ✓";

}



div.innerHTML = `

${msg.reply ? `
<div class="replyBox">↩ ${msg.reply}</div>
` : ''}

<div class="messageText">${msg.text}</div>

<div class="msgTime">${time}${read}</div>

${msg.uid===USER_ID ? `
<div class="actions">
    <button onclick="editMessage('${id}','${msg.text.replace(/'/g,"\\'")}')">✏️</button>
    <button onclick="deleteMessage('${id}')">🗑️</button>
</div>
` : ''}

`;



messages.appendChild(div);

div.onclick = function(e){

    e.stopPropagation();

    // Якщо натиснули кнопку - нічого не закриваємо
    if(e.target.closest("button")) return;

    document.querySelectorAll(".msg").forEach(m=>{
        m.classList.remove("showActions");
    });

    div.classList.add("showActions");

};


setTimeout(() => {
    messages.scrollTop = messages.scrollHeight;
}, 100);


// Позначаємо чуже повідомлення прочитаним
if(msg.uid !== USER_ID && !msg.read){

    db.ref("privateMessages/"+CHAT_ID+"/"+id).update({
        read: true
    });

}

// Прокрутити чат до останнього повідомлення
setTimeout(() => {
    messages.scrollTop = messages.scrollHeight;
}, 50);




}



// =====================
// РЕДАГУВАННЯ
// =====================


function editMessage(id,oldText){


let newText =
prompt(
"Редагувати повідомлення:",
oldText
);



if(!newText)return;


newText=newText.trim();


if(!newText)return;



db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.update({

text:newText,

edited:true

    });

}




// =====================
// ВИДАЛЕННЯ
// =====================


function deleteMessage(id){


if(!confirm(
"Видалити повідомлення?"
))

return;



db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.remove()

.then(()=>{


let msgElement =
document.getElementById(
"msg-"+id
);



if(msgElement){

msgElement.remove();

}



});


}



// =====================
// НАДІСЛАТИ
// =====================


function sendMessage(){

    let value = text.value.trim();

    if(!value) return;

    db.ref("blocked/"+USER_ID+"/"+CHAT_USER)
    .once("value")
    .then(block=>{

        if(block.exists()){
            alert("Ви заблокували цього користувача");
            return;
        }

        // записуємо повідомлення
        db.ref("privateMessages/"+CHAT_ID)
        .push({
            uid: USER_ID,
            text: value,
            reply: null,
            time: firebase.database.ServerValue.TIMESTAMP
        })
        .then(()=>{

            // збільшуємо непрочитані у співрозмовника
           db.ref("chats/"+CHAT_ID+"/unread/"+CHAT_USER)
.transaction(v => {
    console.log("Було:", v);
    return (v || 0) + 1;
})
.then(result => {
    console.log("Стало:", result.snapshot.val());
});

            // оновлюємо останнє повідомлення
            db.ref("chats/"+CHAT_ID).update({
                lastMessage: value,
                lastTime: firebase.database.ServerValue.TIMESTAMP
            });

        });

        text.value="";

        setTimeout(()=>{
            messages.scrollTop = messages.scrollHeight;
        },100);

    });

}

function goBack(){


location.href="Повідомлення.html";


}




// =====================
// ONLINE
// =====================


let onlineTimer;

function setOnline(){

    const ref = db.ref("online/" + USER_ID);

    function updateOnline(){
        ref.update({
            online: true,
            lastSeen: firebase.database.ServerValue.TIMESTAMP
        });
    }

    // Встановити онлайн одразу
    updateOnline();

    // Оновлювати кожні 20 секунд
    clearInterval(onlineTimer);
    onlineTimer = setInterval(updateOnline, 20000);

    // При відключенні
    ref.onDisconnect().set({
        online: false,
        lastSeen: firebase.database.ServerValue.TIMESTAMP
    });

    // Якщо вкладка закривається
    window.addEventListener("beforeunload", () => {
        ref.set({
            online: false,
            lastSeen: Date.now()
        });
    });

}
// =====================
// СТАТУС СПІВРОЗМОВНИКА
// =====================


function watchUserStatus(){

    if(!CHAT_USER) return;

db.ref("usersLocation/" + CHAT_USER).on("value", snap => {

    const loc = snap.val() || {};

    const online =
        loc.online === true &&
        Date.now() - (loc.lastUpdate || 0) < 120000;

    const status = document.getElementById("status");

    if (online) {

       status.textContent = "🟢 онлайн";
    status.className = "online";

    } else if (loc.lastUpdate) {

        const d = new Date(loc.lastUpdate);
        const now = new Date();

        let text;

        if (d.toDateString() === now.toDateString()) {

            text =
                "Був(ла) сьогодні о " +
                d.getHours().toString().padStart(2, "0") +
                ":" +
                d.getMinutes().toString().padStart(2, "0");

        } else {

            text =
                "Був(ла) " +
                d.getDate().toString().padStart(2, "0") +
                "." +
                (d.getMonth() + 1).toString().padStart(2, "0") +
                "." +
                d.getFullYear() +
                " о " +
                d.getHours().toString().padStart(2, "0") +
                ":" +
                d.getMinutes().toString().padStart(2, "0");

        }

        status.textContent = text;
        status.style.color = "#fff";

    } else {

         status.textContent = "⚪ офлайн";
    status.className = "offline";

    }

});

}




// запуск

setTimeout(()=>{

watchUserStatus();

},1000);



// =====================
// DARK MODE
// =====================


function toggleDark(){


document.body.classList.toggle("dark");


localStorage.setItem(

"dark",

document.body.classList.contains("dark")

);


}




if(localStorage.getItem("dark")=="true"){

document.body.classList.add("dark");

}

// =====================
// DELETE CHAT
// =====================


function deleteChat(){


if(!confirm(
"Видалити цей чат?"
))

return;



db.ref(
"privateMessages/"+CHAT_ID
)

.remove();



db.ref(
"chats/"+CHAT_ID
)

.remove();



location.href=
"Повідомлення.html";


}

function openChatMenu(){

    const menu = document.getElementById("chatMenu");

    menu.style.display =
        menu.style.display === "block"
        ? "none"
        : "block";

}
document.addEventListener("click", function(e){

    if(e.target.closest("#chatMenu")) return;
    if(e.target.closest('[onclick="openChatMenu()"]')) return;

    document.getElementById("chatMenu").style.display = "none";

});
function unblockUser(){


db.ref(
"blocked/"+USER_ID+"/"+CHAT_USER
)

.remove();



alert(
"Користувача розблоковано"
);



}

function showNotify(text){


let box=document.getElementById(
"notify"
);


box.textContent=text;


box.style.display="block";



setTimeout(()=>{


box.style.display="none";


},3000);


}

let unreadTitle=0;



function updateTitle(){


if(unreadTitle>0){


document.title=
"("+unreadTitle+") Нове повідомлення";


}else{


document.title="Чат";


}


}
function blockUser(){

db.ref(
"blocked/"+USER_ID+"/"+CHAT_USER
)
.set(true);

alert("Користувача заблоковано");

}

document.addEventListener("click", function(e){

    if(e.target.closest(".msg")) return;

    document.querySelectorAll(".msg").forEach(msg=>{
        msg.classList.remove("showActions");
    });

});

</script>



</body>

</html>
