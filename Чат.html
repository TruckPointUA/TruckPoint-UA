<!DOCTYPE html>
<html lang="uk">

<head>

<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width,initial-scale=1,viewport-fit=cover">

<title>Чат</title>

<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-auth-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.12.2/firebase-database-compat.js"></script>


<style>


*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}



body{

height:100dvh;

display:flex;

flex-direction:column;

background:#edf2f7;

overflow:hidden;
height:100%;
min-height:100dvh;

display:flex;
flex-direction:column;

overflow:hidden;

}



/* ШАПКА */

.header{

height:60px;

background:#1677ff;

color:white;

display:flex;

align-items:center;

padding:0 12px;

gap:12px;

box-shadow:0 2px 10px #0003;

}



.back{

width:42px;
height:42px;

border-radius:50%;

background:rgba(255,255,255,.18);

display:flex;

align-items:center;

justify-content:center;

cursor:pointer;

font-size:28px;

transition:.25s;

backdrop-filter:blur(5px);

}


.back:hover{

background:rgba(255,255,255,.35);

transform:scale(1.08);

}


.back span{

margin-top:-3px;

font-weight:bold;

}



.avatar{

width:42px;

height:42px;

border-radius:50%;

overflow:hidden;

background:#ddd;

}



.avatar img{

width:100%;

height:100%;

object-fit:cover;

}



.userBox{

display:flex;

flex-direction:column;

}



.userName{

font-size:17px;

font-weight:bold;

}



.status{

font-size:12px;

opacity:.8;

}




/* ПОВІДОМЛЕННЯ */


.messages{
    position:fixed;
    top:60px;
    left:0;
    right:0;
    bottom:60px;

    overflow-y:auto;
    overflow-x:hidden;

    padding:10px;
    padding-bottom:20px;

    display:flex;
    flex-direction:column;
    gap:5px;
}


.msg{
    position:relative;

    max-width:42%;
    width:max-content;
    min-width:70px;

    padding:3px 8px;

    border-radius:10px;

    font-size:14px;
    line-height:1.05;

    word-break:break-word;

    margin:2px 0;
}
.me{

align-self:flex-end;

background:#1677ff;

color:white;

border-bottom-right-radius:4px;

}



.other{

align-self:flex-start;

background:white;

color:#222;

border-bottom-left-radius:4px;

}


.msgTime{
    font-size:8px;
    margin-top:0;
}


.actions{
    display:none;

    position:absolute;

    top:50%;
    transform:translateY(-50%);

    background:#fff;
    border-radius:12px;
    box-shadow:0 5px 15px rgba(0,0,0,.2);

    padding:4px;
    gap:4px;

    z-index:1000;
}

.me .actions{
    left:-95px;
}

.other .actions{
    right:-95px;
}

.actions button{
    width:34px;
    height:34px;

    padding:0;

    display:flex;
    align-items:center;
    justify-content:center;

    border:none;
    background:white;

    border-radius:8px;

    font-size:17px;

    cursor:pointer;
}


.actions button:hover{

background:#eee;

}


.msg.showActions .actions{

display:flex;

}


.msg.showActions .actions{
    display:flex;
}



/* ВВІД */


.bottom{
    position:fixed;
    left:0;
    right:0;
    bottom:0;

    height:60px;

    display:flex;
    align-items:center;
    gap:8px;

    padding:8px 10px;

    background:#fff;

    border-top:1px solid #ddd;

    z-index:9999;

    padding-bottom:calc(8px + env(safe-area-inset-bottom));
}
#text{
    flex:1;
    width:100%;
    height:45px;

    border:0;
    background:#f1f3f7;

    border-radius:25px;

    padding:0 18px;

    font-size:15px;

    outline:none;
}



#send{

width:45px;

height:45px;

border-radius:50%;

border:0;

background:#1677ff;

color:white;

font-size:20px;

cursor:pointer;

}


.messageText{

white-space:pre-wrap;

}

.actions{

gap:5px;

}



.actions button{

border-radius:5px;

}

.replyBox{

background:#dbeafe;

padding:5px 8px;

border-left:4px solid #1677ff;

border-radius:8px;

margin-bottom:8px;

font-size:13px;

color:#333;

}


.replyPreview{

display:none;

background:white;

padding:8px;

border-top:1px solid #ddd;

font-size:13px;

}


.replyPreview span{

font-weight:bold;

color:#1677ff;

}


.pin{

font-size:12px;

color:#ffd700;

}
.pinBox{

background:white;

padding:10px;

border-bottom:1px solid #ddd;

font-size:14px;

display:none;

}


.pinBox span{

color:#1677ff;

font-weight:bold;

}


body.dark{

background:#111827;

}


body.dark .messages{

background:#0f172a;

}


body.dark .other{

background:#1e293b;

color:white;

}


body.dark .bottom{

background:#111827;

border-color:#333;

}


body.dark #text{

background:#1e293b;

color:white;

}


body.dark .replyPreview{

background:#1e293b;

color:white;

}

</style>


</head>



<body>

<div id="notify"
style="
display:none;
position:fixed;
top:70px;
left:50%;
transform:translateX(-50%);
background:#1677ff;
color:white;
padding:12px 20px;
border-radius:25px;
z-index:2000;
box-shadow:0 5px 15px #0004;
font-size:15px;
">
</div>

<div class="header">

    <div onclick="deleteChat()"
style="font-size:22px;cursor:pointer">

🗑

</div>

<div onclick="toggleDark()"
style="font-size:22px;cursor:pointer">
🌙
</div>


<div class="back" onclick="goBack()">
    <span>←</span>
</div>

<div onclick="openChatMenu()"
style="margin-left:auto;font-size:25px;cursor:pointer">

⋮

</div>



<div class="avatar">

<img id="chatAvatar"
src="avatars/avatar1.png">

</div>



<div class="userBox">

<div class="userName"
id="chatName">

Користувач

</div>


<div class="status"
id="status">

онлайн

</div>


</div>



</div>




<div class="messages"
id="messages">

</div>
<div class="bottom">


<input id="text"
placeholder="Повідомлення...">



<button id="send">

➤

</button>


</div>

<div id="chatMenu"

style="
display:none;
position:fixed;
right:10px;
top:60px;
background:white;
border-radius:10px;
box-shadow:0 5px 20px #0004;
z-index:999;
overflow:hidden;
">

<div id="blockItem"
onclick="blockUser()"
style="display:none;padding:15px;cursor:pointer">
🚫 Заблокувати
</div>

<div id="unblockItem"
onclick="unblockUser()"
style="display:none;padding:15px;cursor:pointer">
✅ Розблокувати
</div>

</div>




<audio id="msgSound">

<source src="message.mp3" type="audio/mpeg">

</audio>


<script>

const firebaseConfig = {

apiKey: "AIzaSyAzOpcu7kdg0y8xwqD0oKk4eMfFSK946n4",

authDomain: "truckpoint-ua.firebaseapp.com",

databaseURL:
"https://truckpoint-ua-default-rtdb.firebaseio.com",

projectId:"truckpoint-ua",

storageBucket:"truckpoint-ua.firebasestorage.app",

messagingSenderId:"992372126132",

appId:"1:992372126132:web:3378b6b1794066132d42e1"

};



firebase.initializeApp(firebaseConfig);
const sound = document.getElementById("msgSound");

document.addEventListener("click", () => {
    sound.volume = 0;
    sound.play().then(() => {
        sound.pause();
        sound.currentTime = 0;
        sound.volume = 1;
    }).catch(() => {});
}, { once: true });


const auth=firebase.auth();

const db=firebase.database();



let USER_ID="";

let CHAT_ID=localStorage.getItem("chatId");

let CHAT_USER=localStorage.getItem("chatUser");

let replyMessage=null;



const messages=
document.getElementById("messages");


const text=
document.getElementById("text");


const send=
document.getElementById("send");

let typingTimer;


// =====================
// TYPING
// =====================


text.addEventListener("input",()=>{


if(!USER_ID || !CHAT_USER)
return;



db.ref(
"typing/"+CHAT_ID+"/"+USER_ID
)

.set(true);



clearTimeout(typingTimer);



typingTimer=setTimeout(()=>{


db.ref(
"typing/"+CHAT_ID+"/"+USER_ID
)

.set(false);



},1500);



});

// =====================
// ПОКАЗ ДРУКУЄ...
// =====================


function watchTyping(){


if(!CHAT_USER)return;



db.ref(
"typing/"+CHAT_ID+"/"+CHAT_USER
)

.on("value",snap=>{


let status =
document.getElementById("status");



if(snap.val()){


status.textContent="✍️ друкує...";


}else{


watchUserStatus();


}



});


}



watchTyping();



// =====================
// АВТОРИЗАЦІЯ
// =====================


auth.onAuthStateChanged(user=>{


if(user){


USER_ID=user.uid;


loadUser();


loadMessages();


setOnline();


}else{


auth.signInAnonymously();


}


});




// =====================
// ДАНІ СПІВРОЗМОВНИКА
// =====================


function loadUser(){


if(!CHAT_USER)return;


db.ref("users/"+CHAT_USER)
.once("value")
.then(snap=>{

let user=snap.val();

chatName.textContent =
user.name+" "+user.surname;


chatAvatar.src =
user.avatar;

});

}



// =====================
// ЗАВАНТАЖЕННЯ ПОВІДОМЛЕНЬ
// =====================

let firstLoad = true;
function loadMessages(){

    if(!CHAT_ID) return;

    messages.innerHTML = "";

    unreadTitle = 0;
    updateTitle();

    db.ref("privateMessages/" + CHAT_ID).off();

    db.ref("privateMessages/" + CHAT_ID)
    .orderByChild("time")
    .on("child_added", snap => {

        let msg = snap.val();

        addMessage(snap.key, msg);

        // Не відтворювати звук при першому завантаженні історії
        if(firstLoad) return;

        // Звук лише для чужих повідомлень
        if(msg.uid !== USER_ID){

            unreadTitle++;
            updateTitle();

            showNotify("Нове повідомлення");

            const sound = document.getElementById("msgSound");

            if(sound){
                sound.currentTime = 0;
                sound.play().catch(()=>{});
            }
        }

    });

    // Через невелику затримку вважаємо історію завантаженою
    setTimeout(()=>{
        firstLoad = false;
    },1000);
}


// =====================
// ВИВІД ПОВІДОМЛЕННЯ
// =====================


function addMessage(id,msg){


let div=document.createElement("div");
div.id = "msg-" + id;


div.className =
"msg " +
(msg.uid===USER_ID ? "me":"other");



let d=new Date(
msg.time || Date.now()
);



let time =
String(d.getHours()).padStart(2,"0")
+
":"
+
String(d.getMinutes()).padStart(2,"0");



let read = "";

if(msg.uid===USER_ID){

read =
msg.read ? " ✓✓" : " ✓";

}



div.innerHTML = `


${msg.reply ? `

<div class="replyBox">

↩ ${msg.reply}

</div>

`:''}



<div class="messageText">

${msg.text}

</div>


<div class="msgTime">

${time}${read}

</div>



${msg.uid===USER_ID ? `

<div class="actions">


${msg.uid===USER_ID ? `

<button onclick="editMessage('${id}','${msg.text.replace(/'/g,"\\'")}')">

✏️

</button>


<button onclick="deleteMessage('${id}')">

🗑

</button>

`:''}

</div>

`:''}


`;



messages.appendChild(div);

div.onclick = function(e){

    e.stopPropagation();

    // Якщо натиснули кнопку - нічого не закриваємо
    if(e.target.closest("button")) return;

    document.querySelectorAll(".msg").forEach(m=>{
        m.classList.remove("showActions");
    });

    div.classList.add("showActions");

};


setTimeout(() => {
    messages.scrollTop = messages.scrollHeight;
}, 100);


// Позначаємо чуже повідомлення прочитаним
if(msg.uid !== USER_ID && !msg.read){

    db.ref("privateMessages/"+CHAT_ID+"/"+id).update({
        read: true
    });

    db.ref("chats/"+CHAT_ID+"/unread/"+USER_ID).set(0);
}

// Прокрутити чат до останнього повідомлення
setTimeout(() => {
    messages.scrollTop = messages.scrollHeight;
}, 50);




}



// =====================
// РЕДАГУВАННЯ
// =====================


function editMessage(id,oldText){


let newText =
prompt(
"Редагувати повідомлення:",
oldText
);



if(!newText)return;


newText=newText.trim();


if(!newText)return;



db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.update({

text:newText,

edited:true

});


}




// =====================
// ВИДАЛЕННЯ
// =====================


function deleteMessage(id){


if(!confirm(
"Видалити повідомлення?"
))

return;



db.ref(
"privateMessages/"+CHAT_ID+"/"+id
)

.remove()

.then(()=>{


let msgElement =
document.getElementById(
"msg-"+id
);



if(msgElement){

msgElement.remove();

}



});


}



// =====================
// НАДІСЛАТИ
// =====================


function sendMessage(){

    let value = text.value.trim();

    if(!value) return;

    db.ref("blocked/"+USER_ID+"/"+CHAT_USER)
    .once("value")
    .then(block=>{

        if(block.exists()){
            alert("Ви заблокували цього користувача");
            return;
        }

        // записуємо повідомлення
        db.ref("privateMessages/"+CHAT_ID)
        .push({
            uid: USER_ID,
            text: value,
            reply: null,
            time: firebase.database.ServerValue.TIMESTAMP
        })
        .then(()=>{

            // збільшуємо непрочитані у співрозмовника
            db.ref("chats/"+CHAT_ID+"/unread/"+CHAT_USER)
            .transaction(v => (v || 0) + 1);

            // оновлюємо останнє повідомлення
            db.ref("chats/"+CHAT_ID).update({
                lastMessage: value,
                lastTime: firebase.database.ServerValue.TIMESTAMP
            });

        });

        text.value="";

        setTimeout(()=>{
            messages.scrollTop = messages.scrollHeight;
        },100);

    });

}

function goBack(){


location.href="Повідомлення.html";


}




// =====================
// ONLINE
// =====================


function setOnline(){

db.ref("online/"+USER_ID).set({

online:true,

lastSeen:Date.now()

});


db.ref("online/"+USER_ID)
.onDisconnect()
.set({

online:false,

lastSeen:Date.now()

});

}
// =====================
// СТАТУС СПІВРОЗМОВНИКА
// =====================


function watchUserStatus(){


if(!CHAT_USER)return;


db.ref("online/"+CHAT_USER)

.on("value",snap=>{


let status=document.getElementById("status");


if(snap.val()){


status.textContent="🟢 онлайн";


}else{


status.textContent="⚪ офлайн";


}



});


}




// запуск

setTimeout(()=>{

watchUserStatus();

},1000);



// =====================
// DARK MODE
// =====================


function toggleDark(){


document.body.classList.toggle("dark");


localStorage.setItem(

"dark",

document.body.classList.contains("dark")

);


}




if(localStorage.getItem("dark")=="true"){

document.body.classList.add("dark");

}

// =====================
// DELETE CHAT
// =====================


function deleteChat(){


if(!confirm(
"Видалити цей чат?"
))

return;



db.ref(
"privateMessages/"+CHAT_ID
)

.remove();



db.ref(
"chats/"+CHAT_ID
)

.remove();



location.href=
"Повідомлення.html";


}

function openChatMenu(){

let menu=document.getElementById("chatMenu");

menu.style.display =
menu.style.display==="block"
?
"none"
:
"block";

}
{


let menu=document.getElementById(
"chatMenu"
);


menu.style.display=

menu.style.display==="block"

?

"none"

:

"block";


}
function unblockUser(){


db.ref(
"blocked/"+USER_ID+"/"+CHAT_USER
)

.remove();



alert(
"Користувача розблоковано"
);



}

function showNotify(text){


let box=document.getElementById(
"notify"
);


box.textContent=text;


box.style.display="block";



setTimeout(()=>{


box.style.display="none";


},3000);


}

let unreadTitle=0;



function updateTitle(){


if(unreadTitle>0){


document.title=
"("+unreadTitle+") Нове повідомлення";


}else{


document.title="Чат";


}


}
function blockUser(){

db.ref(
"blocked/"+USER_ID+"/"+CHAT_USER
)
.set(true);

alert("Користувача заблоковано");

}

document.addEventListener("click", function(e){

    if(e.target.closest(".msg")) return;

    document.querySelectorAll(".msg").forEach(msg=>{
        msg.classList.remove("showActions");
    });

});
</script>



</body>

</html>
